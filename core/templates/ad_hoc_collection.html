<script>
let hotInstance = null;

function switchTab(tabId, event) {
    // 1. Remove .active from all tabs and hide them
    document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
        content.style.display = 'none';
    });

    // 2. Remove .active from all buttons
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    // 3. Show the selected tab and add .active
    const selectedTab = document.getElementById(tabId);
    if (selectedTab) {
        selectedTab.classList.add('active');
        selectedTab.style.display = 'block';
    }

    // 4. Highlight the button
    if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
    }

    // 5. Wake up Handsontable
    if (tabId === 'table-view' && hotInstance) {
        setTimeout(() => {
            hotInstance.render();
        }, 50);
    }
}

function filterSpreadsheet() {
    if (!hotInstance) return;

    // 1. Get IDs and force them to Strings
    const visibleCards = document.querySelectorAll('.card-item:not(.hidden-card):not(.folder)');
    const visibleIds = Array.from(visibleCards).map(card => Number(card.getAttribute('data-id')));
    console.log("vis", visibleIds);
    const filtersPlugin = hotInstance.getPlugin('filters');
    const colHeaders = hotInstance.getColHeader();
    // 2. Find ID column
    const idColIndex = colHeaders.findIndex(header => 
        header.toLowerCase() === 'card_id'
    );
    console.log(idColIndex)
    if (idColIndex === -1) return;

    // 3. Clear and Re-apply
    filtersPlugin.clearConditions(idColIndex);
    
    if (visibleIds.length > 0) {
        // We use a custom function to ensure type-insensitive matching
        filtersPlugin.addCondition(idColIndex, 'by_value', [visibleIds]);
    } else {
        filtersPlugin.addCondition(idColIndex, 'by_value', [['__NONE__']]);
    }

    filtersPlugin.filter();
    hotInstance.render();
}
function imageRenderer(instance, td, row, col, prop, value, cellProperties) {
    // Clear the cell
    td.innerHTML = '';

    if (value) {
        const img = document.createElement('img');
        img.src = value;
        // Apply some styling so the images don't explode the row height
        img.style.width = '50px';
        img.style.height = 'auto';
        img.style.display = 'block';
        img.style.margin = '0 auto';
        
        td.appendChild(img);
    } else {
        td.innerText = 'No Image';
    }

    return td;
}
function launchSequence() {
    // 1. Target the specific name attribute from your HTML
    const checkedBoxes = document.querySelectorAll('input[name="selected_cards"]:checked');
    const uncheckedBoxes = document.querySelectorAll('input[name="selected_cards"]:not(:checked)');
    console.log(`Found ${checkedBoxes.length} cards selected.`);
    console.log(`Found ${uncheckedBoxes.length} cards not selected.`);
    let idQueue;
    if (checkedBoxes.length > 0) {
        // 2. Map the IDs from the value attribute
        idQueue = Array.from(checkedBoxes).map(cb => cb.value);
    } else {
        idQueue = Array.from(uncheckedBoxes).map(cb => cb.value);
    }
    //console.log(idQueue)
    // 3. Clear any old session data and save the new sequence
    sessionStorage.removeItem('card_sequence');
    sessionStorage.setItem('card_sequence', JSON.stringify(idQueue));
    if (hotInstance) {
        hotInstance.deselectCell();
    }
}
// Prevent infinite loops when the server updates the table back
let isApplyingServerUpdate = false;

function updateSpreadsheet(tableData, colHeaders) {
    const container = document.getElementById('hot-spreadsheet');
    if (!container) return;

    // Create column objects (needed for proper data-to-field mapping)
    const columnSettings = colHeaders.map(header => {
        return { 
            data: header.toLowerCase().replace(' ', '_'), // Standardize keys (e.g., "Card Name" -> "card_name")
            readOnly: header.toLowerCase() === 'id' || header.toLowerCase() === 'image'
        };
    });

    if (!hotInstance) {
        hotInstance = new Handsontable(container, {
            data: tableData,
            colHeaders: colHeaders,
            columns: columnSettings,
            rowHeaders: true,
            height: '70vh',
            stretchH: 'all',
            licenseKey: 'non-commercial-and-evaluation',
            filters: true,
            dropdownMenu: true,
            
            // --- THE EDIT HOOK ---
            afterChange: function(changes, source) {
                console.log("afterchange")
                // Ignore changes triggered by the server or initial load
                if (source === 'loadData' || isApplyingServerUpdate) return;

                changes.forEach(([visualRow, prop, oldValue, newValue]) => {
                    if (oldValue === newValue) return;

                    // Package the change for your quickEdit function
                    const updatedFields = {};
                    updatedFields[prop] = newValue;

                    quickEdit(this, visualRow, updatedFields);
                });
            }
        });
    } else {
        hotInstance.loadData(tableData);
    }
    filterSpreadsheet();
}
function quickEdit(hot, visualRow, updatedFields) {
    // 1. Resolve the ID (Assuming 'id' is a column property)
    const csrId = hot.getDataAtRowProp(visualRow, 'id');
    
    if (!csrId) {
        console.error("Could not find ID for row:", visualRow);
        return;
    }

    // Visual feedback: Dim the row to show it's saving
    const physicalRow = hot.toPhysicalRow(visualRow);
    
    $.ajax({
        url: "/update_csr_fields/",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify({
            csrId: csrId,
            allFields: updatedFields
        }),
        success: response => {
    console.log("--- AJAX Success Start ---");
    const serverData = response.search_result;
    console.log("Server Data Received:", serverData);
    console.log("Target Visual Row (from function arg):", visualRow);

    // 1. Validate Row Index
    const vRow = parseInt(visualRow, 10);
    console.log("Parsed vRow:", vRow, "| Type:", typeof vRow);
    
    if (isNaN(vRow) || vRow < 0) {
        console.error("CRITICAL: vRow is invalid! This will cause the 'unsigned number' error.");
        return;
    }

    hot.batch(() => {
        isApplyingServerUpdate = true;

        Object.entries(serverData).forEach(([field, value]) => {
            // 2. Validate Column Mapping
            const colIndex = hot.propToCol(field);
            console.log(`Checking field: "${field}" | Value: ${value} | Found Col Index:`, colIndex);

            if (colIndex !== null && colIndex !== undefined && colIndex >= 0) {
                try {
                    console.log(`Executing: hot.setDataAtRowProp(${vRow}, "${field}", ${value})`);
                    hot.setDataAtRowProp(vRow, field, value, 'serverUpdate');
                } catch (e) {
                    console.error(`Crashed during setDataAtRowProp for field "${field}":`, e.message);
                }
            } else {
                console.warn(`SKIPPING: Field "${field}" does not exist in table columns. Mapping it would crash.`);
            }
        });

        isApplyingServerUpdate = false;
    });
    
    console.log("--- AJAX Success End ---");
    if (typeof syncCardView === 'function') syncCardView(csrId, serverData);
},
        error: xhr => {
            console.error("Save failed:", xhr.responseText);
            // Optional: Revert the cell value on error
            hot.render(); 
        }
    });
}
function syncCardView(id, updatedFields) {
    const card = document.querySelector(`.card-item[data-id="${id}"]`);
    if (!card) return;

    // Update text fields (Title, Price, etc.)
    Object.entries(updatedFields).forEach(([field, value]) => {
        const element = card.querySelector(`.card-${field}`);
        if (element) {
            element.textContent = value;
        }
    });

    // Special Case: Update Status color if it changed
    if (updatedFields.status) {
        card.className = card.className.replace(/status-\w+/, `status-${updatedFields.status.toLowerCase()}`);
    }
}
</script>

.card-list {

/* Ensure actions stay on top and clickable */

.image-wrapper {

}

.thumbnail {

    left: 0;
    width: 100%;
    height: 100%;

    transition: opacity 0.3s ease;
}
/* The default image is always visible unless hovered */
.thumbnail.default {
    opacity: 1;
    z-index: 1;
}

/* The hover image sits on top but is invisible until hovered */
.thumbnail.hover {
    opacity: 0;
    z-index: 2;
}

/* Switch opacities on hover */
.image-wrapper:hover .thumbnail.hover {
    opacity: 1;
}

.image-wrapper:hover .thumbnail.default {

}

.tooltip-wrapper {
