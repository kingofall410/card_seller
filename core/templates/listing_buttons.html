{% load custom_tags %}
{% get_product_groups as groups %}

<style>
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
</style>

<script>
function showSpinnerOnButton(button) {
    button.originalText = button.textContent;
    button.disabled = true;

    const spinner = document.createElement('span');
    spinner.style.display = 'inline-block';
    spinner.style.width = '16px';
    spinner.style.height = '16px';
    spinner.style.border = '2px solid #ccc';
    spinner.style.borderTop = '2px solid #333';
    spinner.style.borderRadius = '50%';
    spinner.style.animation = 'spin 0.6s linear infinite';
    spinner.style.marginLeft = '8px';

    button.textContent = '';
    button.appendChild(spinner);
}

function restoreButton(button) {
    button.textContent = button.originalText || 'List';
    button.disabled = false;
}

function updateLiField(el) {
    const liId = el.dataset.cardInfoId;
    const field = el.dataset.field;
    const value = el.type === "checkbox" ? el.checked : el.value;

    $.ajax({
        url: "/update_li_fields/",
        method: "POST",
        data: {
            li_id: liId,
            field: field,
            value: value
        },
        success: () => {
            console.log("Updated", field, "→", value);
        }
    });
}

document.addEventListener("DOMContentLoaded", function () {
    const cardId = "{{ card_id }}";
    const searchResultId = "{{ search_result.id }}";

    const listBtn = document.getElementById(`list-btn-${cardId}`);
    const listNextBtn = document.getElementById(`list-next-btn-${cardId}`);
    const listUpBtn = document.getElementById(`list-up-btn-${cardId}`);
    const exportBtn = document.getElementById(`export-btn-${cardId}`);

    const groupSelect = document.getElementById(`group-select-${cardId}`);
    const scheduleInput = document.getElementById(`schedule-${cardId}`);
    const publishInput = document.getElementById(`publish-${cardId}`);
    const priceInput = document.getElementById(`price-${cardId}`);
    const qtyInput = document.getElementById(`qty-${cardId}`);

    listBtn.addEventListener("click", () => {
        performListAction(
            listBtn,
            priceInput,
            qtyInput,
            searchResultId,
            groupSelect,
            publishInput,
            scheduleInput,
            () => location.reload()
        );
    });

    listNextBtn.addEventListener("click", () => {
        performListAction(
            listNextBtn,
            priceInput,
            qtyInput,
            searchResultId,
            groupSelect,
            publishInput,
            scheduleInput,
            () => handleNext()
        );
    });

    listUpBtn.addEventListener("click", () => {
        performListAction(
            listUpBtn,
            priceInput,
            qtyInput,
            searchResultId,
            groupSelect,
            publishInput,
            scheduleInput,
            () => handleUp()
        );
    });

    function performListAction(button, priceInput, qtyInput, searchResultId, groupSelect, publishInput, scheduleInput, onSuccess) {
        const groupKey = groupSelect.value || "";
        const publishValue = publishInput.checked ? "True" : "False";
        const scheduleTime = scheduleInput.value;
        const price = priceInput.value;
        const qty = qtyInput.value;

        showSpinnerOnButton(button);

        const url = `/list_card/${searchResultId}?publish=${publishValue}`
                  + `&group_key=${encodeURIComponent(groupKey)}`
                  + `&price=${encodeURIComponent(price)}`
                  + `&qty=${encodeURIComponent(qty)}`
                  + `&schedule=${encodeURIComponent(scheduleTime)}`;

        fetch(url)
          .then(res => res.json())
          .then(data => {
              console.log("List response:", data);
              if (onSuccess) onSuccess(data);
          })
          .catch(err => console.error("List failed:", err))
          .finally(() => restoreButton(button));
    }

    // FIXED: this now runs because it's inside the single DOMContentLoaded
    document.querySelectorAll(".group-select").forEach(select => {
        select.addEventListener("change", function () {
            if (this.value !== "__new__") return;

            const title = prompt("Enter a name for the new group:");
            if (!title || title.trim() === "") {
                this.value = "";
                return;
            }

            const newOption = document.createElement("option");
            newOption.value = title;
            newOption.textContent = title;

            const newGroupOption = this.querySelector('option[value="__new__"]');
            this.insertBefore(newOption, newGroupOption);

            this.value = title;
        });
    });
});
</script>

<div style="margin-top: 20px; margin-bottom: 20px; position: relative;">

  <div style="display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start;">

    <div style="display:flex; flex-direction:column;">
      <label for="price-{{ card_id }}" style="font-weight:600; margin-bottom:4px;">
        List Price
      </label>
      <input type="text"
            id="price-{{ card_id }}"
            data-card-info-id="{{ card.listed_card_info.id }}"
            data-field="list_price"
            value="{{ card.listed_card_info.list_price|floatformat:2 }}"
            onblur="updateLiField(this)"
            style="padding: 8px; border-radius: 6px; min-width: 200px;" />
    </div>

    <div style="display:flex; flex-direction:column;">
      <label for="qty-{{ card_id }}" style="font-weight:600; margin-bottom:4px;">
        Quantity
      </label>
      <input type="text"
            id="qty-{{ card_id }}"
            data-card-info-id="{{ card.listed_card_info.id }}"
            data-field="list_qty"
            value="{{ card.listed_card_info.list_qty }}"
            onblur="updateLiField(this)"
            style="padding: 8px; border-radius: 6px; min-width: 200px;" />
    </div>

    <div style="display:flex; flex-direction:column;">
      <label for="group-select-{{ card_id }}" style="font-weight:600; margin-bottom:4px;">
        Group Name
      </label>

      <select id="group-select-{{ card_id }}" class="group-select"
              data-card-id="{{ card_id }}"
              style="padding: 8px; border-radius: 6px; min-width: 180px;">
        <option value="">No Group (Single Listing)</option>

        {% for g in groups %}
          <option value="{{ g.key }}"
            {% if g.key == search_result.ebay_product_group.group_key %}
              selected
            {% endif %}>
          {{ g.name }}</option>
        {% endfor %}

        <option value="__new__">➕ New Group…</option>
      </select>
    </div>

    {% now "Y-m-d\TH:i" as current_time %}
    
    <div style="display:flex; flex-direction:column;">
      <label for="schedule-{{ card_id }}" style="font-weight:600; margin-bottom:4px;">
        Schedule Time
      </label>
      <input type="datetime-local"
             id="schedule-{{ card_id }}"
             value="{{ current_time }}"
             style="padding: 8px; border-radius: 6px; min-width: 200px;" />
    </div>

    <div style="display:flex; flex-direction:row; gap: 20px; flex-wrap: wrap; width: 100%;">
      {% for group in search_result.get_pricing_groups %}
        <div style="display:flex; flex-direction:column; flex: 0 0 calc(25% - 15px); min-width: 0;">
          <label for="msrp-{{ card_id }}-{{ group.id }}" style="font-weight:600; margin-bottom:4px; font-size: 0.85rem; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            {{ group.label }}
          </label>
          <div style="position: relative; display: flex; align-items: center;">
            <span style="position: absolute; left: 10px; color: #888;">$</span>
            <input type="text" 
                  id="msrp-{{ card_id }}-{{ group.id }}" 
                  value="{{ group.recent_avg_price|floatformat:2 }}" 
                  style="padding: 8px 8px 8px 20px; border: 1px solid #ccc; border-radius: 6px; width: 100%; box-sizing: border-box; background-color: #f9f9f9;" 
                  readonly />
          </div>
        </div>
      {% empty %}
        <p style="font-size: 0.9rem; color: #999;">No pricing groups found.</p>
      {% endfor %}
    </div>
    <div style="display:flex; flex-direction:column;">
      <label style="font-weight:600; margin-bottom:4px;">
        Publish
      </label>
      <label style="display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="publish-{{ card_id }}" checked />
        Enable
      </label>
    </div>

  </div>

</div>
