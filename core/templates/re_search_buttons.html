{% load custom_tags %}
{% get_product_groups as groups %}

<script>
function showSpinnerOnButton(button) {
    button.originalText = button.textContent;
    button.disabled = true;

    const spinner = document.createElement('span');
    spinner.style.display = 'inline-block';
    spinner.style.width = '16px';
    spinner.style.height = '16px';
    spinner.style.border = '2px solid #ccc';
    spinner.style.borderTop = '2px solid #333';
    spinner.style.borderRadius = '50%';
    spinner.style.animation = 'spin 0.6s linear infinite';
    spinner.style.marginLeft = '8px';

    button.textContent = '';
    button.appendChild(spinner);
}

function restoreButton(button) {
    button.textContent = button.originalText || 'List';
    button.disabled = false;
}
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const cardId = "{{ card_id }}";
    const searchResultId = "{{ search_result.id }}";
    const collectionId = "{{ collection_id }}";

    /* ---------------------------
       TOP BUTTONS
    ----------------------------*/
    const imageSearchBtn = document.getElementById(`image-search-btn-${cardId}`);
    const textFilterBtn = document.getElementById(`text-filter-btn-${cardId}`);
    const priceBtn = document.getElementById(`price-btn-${cardId}`);
    const saveBtn = document.getElementById(`save-btn-${cardId}`);
    const saveNextBtn = document.getElementById(`save-next-btn-${cardId}`);

    imageSearchBtn.addEventListener('click', () => {
        fetch(`/image_search/${cardId}/`, {
            method: 'POST',
            body: JSON.stringify({ required_words: collectAllFields(cardId) })
        }).then(() => location.reload());
    });

    textFilterBtn.addEventListener('click', () => {
        let allFields = collectAllFields(cardId);
        fetch(`/text_filter/`, {
            method: 'POST',
            body: JSON.stringify({
                required_words: allFields,
                csr_ids: [searchResultId],
                new_search: true
            })
        }).then(() => location.reload());
    });

    priceBtn.addEventListener('click', () => {
        showSpinnerOnButton(priceBtn);
        fetch(`/price_only/${searchResultId}/`, { method: 'GET' })
            .then(() => location.reload())
            .finally(() => restoreButton(priceBtn));
    });

    saveBtn.addEventListener('click', () => {
        let allFields = collectAllFields(cardId);
        allFields["notes"] = document.getElementById("notes").value;

        $.ajax({
            url: "/update_csr_fields/",
            method: "POST",
            data: JSON.stringify({ csrId: searchResultId, allFields }),
            success: () => alert("Changes saved successfully."),
            error: xhr => alert("Error saving changes.")
        });
    });

    saveNextBtn.addEventListener('click', () => {
        let allFields = collectAllFields(cardId);
        allFields["notes"] = document.getElementById("notes").value;

        $.ajax({
            url: "/update_csr_fields/",
            method: "POST",
            data: {
                csrId: searchResultId,
                ...allFields,
                csrfmiddlewaretoken: '{{ csrf_token }}'
            },
            success: () => {
                {% if page_obj.has_next %}
                    submitCardForm(null, null, "/card/{{page_obj.object_list.0.1}}/?page={{ page_obj.next_page_number }}");
                {% else %}
                    submitCardForm(null, null, "/card/{{page_obj.object_list.0.1}}/?page=1");
                {% endif %}
            }
        });
    });

    /* ---------------------------
       LISTING BUTTONS
    ----------------------------*/
    const listBtn = document.getElementById(`list-btn-${cardId}`);
    const listNextBtn = document.getElementById(`list-next-btn-${cardId}`);
    const listUpBtn = document.getElementById(`list-up-btn-${cardId}`);
    const clearListedInfoBtn = document.getElementById(`clear-listed-info-btn-${cardId}`);

    const groupSelect = document.getElementById(`group-select-${cardId}`);
    const scheduleInput = document.getElementById(`schedule-${cardId}`);
    const publishInput = document.getElementById(`publish-${cardId}`);

    listBtn.addEventListener("click", () => {
        performListAction(listBtn, searchResultId, groupSelect, publishInput, scheduleInput, () => location.reload());
    });

    listNextBtn.addEventListener("click", () => {
        performListAction(listNextBtn, searchResultId, groupSelect, publishInput, scheduleInput, () => handleNext());
    });

    listUpBtn.addEventListener("click", () => {
        performListAction(listUpBtn, searchResultId, groupSelect, publishInput, scheduleInput, () => handleUp());
    });

    clearListedInfoBtn.addEventListener("click", () => {
        clearListedInfo(clearListedInfoBtn, cardId)
    });

    function performListAction(button, searchResultId, groupSelect, publishInput, scheduleInput, onSuccess) {
        const groupKey = groupSelect.value || "";
        const publishValue = publishInput.checked ? "True" : "False";
        const scheduleTime = scheduleInput.value;

        showSpinnerOnButton(button);

        const url = `/list_card/${searchResultId}?publish=${publishValue}`
                  + `&group_key=${encodeURIComponent(groupKey)}`
                  + `&schedule=${encodeURIComponent(scheduleTime)}`;

        fetch(url)
            .then(res => res.json())
            .then(data => onSuccess && onSuccess(data))
            .finally(() => restoreButton(button));
    }

    function clearListedInfo(button, cardId) {
        
        showSpinnerOnButton(button);

        const url = `/clear_listed_info/${cardId}`;

        fetch(url)
            .then(res => res.json())
            .then(data => onSuccess && onSuccess(data))
            .finally(() => restoreButton(button));
    }

    /* ---------------------------
       GROUP SELECT (NEW GROUP)
    ----------------------------*/
    document.querySelectorAll(".group-select").forEach(select => {
        select.addEventListener("change", function () {
            if (this.value !== "__new__") return;

            const title = prompt("Enter a name for the new group:");
            if (!title || title.trim() === "") {
                this.value = "";
                return;
            }

            const newOption = document.createElement("option");
            newOption.value = title;
            newOption.textContent = title;

            const newGroupOption = this.querySelector('option[value="__new__"]');
            this.insertBefore(newOption, newGroupOption);

            this.value = title;
        });
    });
});
</script>

      <button id="list-up-btn-{{ card_id }}" style="padding: 8px 16px; background-color: #2ecc70ff; color: white; border: none; border-radius: 6px; cursor: pointer;">

      </button>
    </div>

  </div>
