{% load custom_tags %}
{% get_product_groups as groups %}

<style>
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
/* Optional: add a class to dim the dropzone while loading */
.loading-active {
    opacity: 0.6;
    pointer-events: none; /* Prevent double-uploads */
}
</style>

<script>
function showSpinnerOnButton(element) {
    // Save original state
    element.originalContent = element.innerHTML;
    element.disabled = true; 
    element.classList.add('loading-active');

    const spinner = document.createElement('span');
    spinner.className = 'loading-spinner'; // For easier cleanup
    spinner.style.display = 'inline-block';
    spinner.style.border = '4px solid #ccc';
    spinner.style.borderTop = '4px solid #333';
    spinner.style.borderRadius = '50%';
    spinner.style.animation = 'spin 0.8s linear infinite';

    element.innerHTML = ''; 
    element.appendChild(spinner);
}

function restoreButton(element) {
    element.innerHTML = element.originalContent;
    element.disabled = false;
    element.classList.remove('loading-active');
}
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const cardId = "{{ card_id }}";
    const searchResultId = "{{ search_result.id }}";
    const collectionId = "{{ collection_id }}";

    /* ---------------------------
       TOP BUTTONS
    ----------------------------*/
    const imageSearchBtn = document.getElementById(`image-search-btn-${cardId}`);
    const textFilterBtn = document.getElementById(`text-filter-btn-${cardId}`);
    const priceBtn = document.getElementById(`price-btn-${cardId}`);
    const priceNextBtn = document.getElementById(`price-next-btn-${cardId}`);
    

    imageSearchBtn.addEventListener('click', () => {
        fetch(`/image_search/${cardId}/`, {
            method: 'POST',
            body: JSON.stringify({ required_words: collectAllFields(cardId) })
        }).then(() => location.reload());
    });

    textFilterBtn.addEventListener('click', () => {
        let allFields = collectAllFields(cardId);
        fetch(`/text_filter/`, {
            method: 'POST',
            body: JSON.stringify({
                required_words: allFields,
                csr_ids: [searchResultId],
                new_search: true
            })
        }).then(() => location.reload());
    });

    priceBtn.addEventListener('click', () => {
        showSpinnerOnButton(priceBtn);
        fetch(`/price_only/${searchResultId}/`, { method: 'GET' })
            .then(() => location.reload())
            .finally(() => restoreButton(priceBtn));
    });

    /* ---------------------------
       LISTING BUTTONS
    ----------------------------*/
    const listBtn = document.getElementById(`list-btn-${cardId}`);
    const listNextBtn = document.getElementById(`list-next-btn-${cardId}`);
    const listUpBtn = document.getElementById(`list-up-btn-${cardId}`);
    const clearListedInfoBtn = document.getElementById(`clear-listed-info-btn-${cardId}`);

    const groupSelect = document.getElementById(`group-select-${cardId}`);
    const scheduleInput = document.getElementById(`schedule-${cardId}`);
    const publishInput = document.getElementById(`publish-${cardId}`);

    function performListAction(button, searchResultId, groupSelect, publishInput, scheduleInput, onSuccess) {
        const groupKey = groupSelect.value || "";
        const publishValue = publishInput.checked ? "True" : "False";
        const scheduleTime = scheduleInput.value;

        showSpinnerOnButton(button);

        const url = `/list_card/${searchResultId}?publish=${publishValue}`
                  + `&group_key=${encodeURIComponent(groupKey)}`
                  + `&schedule=${encodeURIComponent(scheduleTime)}`;

        fetch(url)
            .then(res => res.json())
            .then(data => onSuccess && onSuccess(data))
            .finally(() => restoreButton(button));
    }

    function clearListedInfo(button, cardId) {
        
        showSpinnerOnButton(button);

        const url = `/clear_listed_info/${cardId}`;

        fetch(url)
            .then(res => res.json())
            .then(data => onSuccess && onSuccess(data))
            .finally(() => restoreButton(button));
    }

    /* ---------------------------
       GROUP SELECT (NEW GROUP)
    ----------------------------*/
    document.querySelectorAll(".group-select").forEach(select => {
        select.addEventListener("change", async function () {
            // 1. If we aren't creating a new group, we need to fetch the next date
            if (this.value !== "__new__") {
                const groupId = this.value;
                const cardId = "{{ card_id }}"; // Ensure this template tag is rendered correctly
                
                // 2. Fetch the next available listing date from your server
                try {
                    const response = await fetch(`/get_next_listing_date/?group_id=${groupId}`);
                    const data = await response.json();
                    
                    // 3. Find the specific schedule input for this card
                    // Assuming your schedule input has an ID like 'schedule-123'
                    const scheduleInput = document.getElementById(`schedule-${cardId}`);
                    
                    if (scheduleInput && data.next_date) {
                        // Update the value with the date returned from the server
                        scheduleInput.value = data.next_date;
                    }
                } catch (error) {
                    console.error("Error fetching next date:", error);
                }
            } else {

                const title = prompt("Enter a name for the new group:");
                if (!title || title.trim() === "") {
                    this.value = ""; // Reset dropdown if cancelled
                    return;
                }

                const url = `/new_group/${encodeURIComponent(title.trim())}`;

                try {
                    const response = await fetch(url);
                    const data = await response.json();

                    if (data.success) {
                        // Create the option using the actual ID from the database
                        const newOption = document.createElement("option");
                        newOption.value = data.id; 
                        newOption.textContent = data.title;

                        // Insert before the "__new__" option
                        const newGroupOption = this.querySelector('option[value="__new__"]');
                        this.insertBefore(newOption, newGroupOption);

                        // Set the dropdown to the newly created group
                        this.value = data.id;
                    } else {
                        alert("Failed to create group: " + (data.error || "Unknown error"));
                        this.value = "";
                    }
                } catch (err) {
                    console.error("Group creation failed:", err);
                    this.value = "";
                }
            }
        });
    });
});
</script>
