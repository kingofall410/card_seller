<html>
<head>
    <title>Manage Collections</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
{% load static %}

<body>

{% include "header.html" %}

<style>
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
/* Optional: add a class to dim the dropzone while loading */
.loading-active {
    opacity: 0.6;
    pointer-events: none; /* Prevent double-uploads */
}
</style>

<script>
function showSpinnerOnButton(element) {
    // Save original state
    element.originalContent = element.innerHTML;
    element.disabled = true; 
    element.classList.add('loading-active');

    const spinner = document.createElement('span');
    spinner.className = 'loading-spinner'; // For easier cleanup
    spinner.style.display = 'inline-block';
    spinner.style.width = '40px';  // Increased size for the dropzone
    spinner.style.height = '40px';
    spinner.style.border = '4px solid #ccc';
    spinner.style.borderTop = '4px solid #333';
    spinner.style.borderRadius = '50%';
    spinner.style.animation = 'spin 0.8s linear infinite';

    element.innerHTML = ''; 
    element.appendChild(spinner);
}

function restoreButton(element) {
    element.innerHTML = element.originalContent;
    element.disabled = false;
    element.classList.remove('loading-active');
}

function launchSequence() {
    // 1. Target the specific name attribute from your HTML
    const checkedBoxes = document.querySelectorAll('input[name="selected_cards"]:checked');
    const uncheckedBoxes = document.querySelectorAll('input[name="selected_cards"]:not(:checked)');
    console.log(`Found ${checkedBoxes.length} cards selected.`);
    console.log(`Found ${uncheckedBoxes.length} cards not selected.`);
    let idQueue;
    if (checkedBoxes.length > 0) {
        // 2. Map the IDs from the value attribute
        idQueue = Array.from(checkedBoxes).map(cb => cb.value);
    } else {
        idQueue = Array.from(uncheckedBoxes).map(cb => cb.value);
    }
    console.log(idQueue)
    // 3. Clear any old session data and save the new sequence
    sessionStorage.removeItem('card_sequence');
    sessionStorage.setItem('card_sequence', JSON.stringify(idQueue));
}
</script>

<div id="collection-tree">
    {% include "manage_collection_node.html" with collection=collection settings=settings %}
</div>


</body>
</html>
