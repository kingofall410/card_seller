

<div id="tab-grid" class="tab-pane active">
    <div id="visual-card-grid">
        </div>
    <div id="infinite-loader" style="display:none; text-align:center; padding:20px;">Applying Filters...</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if(typeof CardLiveFeedUpdater !== 'undefined') CardLiveFeedUpdater.init();
});

const CardLiveFeedUpdater = {
    visibleCardIds: new Set(), observer: null, updateTimeoutId: null,
    updateIntervalMs: 6000, batchDelayMs: 400,

    init() {
        this.setupIntersectionObserver();
        this.startPeriodicSync();
    },
    setupIntersectionObserver() {
        this.observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const cardId = entry.target.getAttribute('data-id');
                if (!cardId) return;
                entry.isIntersecting ? this.visibleCardIds.add(cardId) : this.visibleCardIds.delete(cardId);
            });
            clearTimeout(this.updateTimeoutId);
            this.updateTimeoutId = setTimeout(() => this.triggerBatchUpdate(), this.batchDelayMs);
        }, { root: null, rootMargin: '80px', threshold: 0.1 });

        this.observeGridItems();
        const targetGrid = document.getElementById('visual-card-grid');
        if (targetGrid) {
            new MutationObserver(() => this.observeGridItems()).observe(targetGrid, { childList: true });
        }
    },
    observeGridItems() {
        document.querySelectorAll('#visual-card-grid .card-item').forEach(card => {
            if (card.offsetWidth > 0 || card.offsetHeight > 0) this.observer.observe(card);
        });
    },
    getCsrfToken() { return document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''; },
    triggerBatchUpdate() {
        const idsToUpdate = Array.from(this.visibleCardIds);
        if (idsToUpdate.length === 0) return;
        $.ajax({
            url: "/get_flat_cards/", method: "POST",
            headers: { 'X-CSRFToken': this.getCsrfToken() }, data: { 'card_ids': idsToUpdate },
            success: (res) => { if (res?.data && typeof patchCardUpdates === 'function') patchCardUpdates(res.data); }
        });
    },
    startPeriodicSync() { setInterval(() => { if (document.visibilityState === 'visible') this.triggerBatchUpdate(); }, this.updateIntervalMs); }
};

function syncCardView(id, updatedFields) {
    const card = document.querySelector(`.card-item[data-id="${id}"]`);
    if (!card) return;
    Object.entries(updatedFields).forEach(([field, value]) => {
        const el = card.querySelector(`.card-${field}`);
        if (el) el.textContent = value;
    });
    if (updatedFields.status) {
        card.className = card.className.replace(/status-\w+/, `status-${updatedFields.status.toLowerCase()}`);
    }
}
</script>
