{% load custom_tags %}

<style>
    /* --- Main Page Layout --- */
    .dashboard-container {
        display: grid;
        grid-template-columns: 1fr; /* Set to 1 full column since sidebar is removed */
        gap: 30px; 
        padding: 20px;
        background-color: #fcfcfc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* --- Content Header --- */
    .main-content { grid-column: 1; }
    .content-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding: 12px 20px;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
    }

    #header-info-mount {
        display: flex;
        flex-direction: column;
        gap: 5px;
        width: 100%;
    }

    #visual-card-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
    }
</style>

{% regroup cards by product_group_key as group_list %}

<div class="dashboard-container">
    <main class="main-content">
        <header class="content-header">
            <div id="header-info-mount">
                <div class="dataTables_info" style="font-size: 14px; color: #1a1a1a; font-weight: 600;">
                    Showing {{ group_list|length }} unique product group{{ group_list|length|pluralize }}
                </div>
            </div>
        </header>

        <div id="visual-card-grid">
            {% for group in group_list %}
                <div class="group-item-card" data-group-key="{{ group.grouper }}" style="display: block;">
                    {% include "product_group.html" with group=group %}
                </div>
            {% endfor %}
        </div>
    </main>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script>
    // Keep your original drill-down navigation alive on double-click
    $(document).on('dblclick', '.group-item-card', function (e) {
        e.preventDefault();
        const groupKey = $(this).attr('data-group-key');
        if (!groupKey) return;

        const targetUrl = `${window.location.pathname}?group_keys=${encodeURIComponent(groupKey)}`;
        console.log(`Drilling Down into targeted Group Matrix View: ${targetUrl}`);
        window.open(targetUrl, '_blank');
    });

    // Keep your original live feed delta listeners operational without script breaks
    function patchCardUpdates(updatedCards) {
        console.log("Card live delta payload tracked.", updatedCards);
    }
</script>
