<div class="tag-editor-component" style="border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 5px; max-width: 500px;">
    <h4>Manage Metadata for: <strong>{{ obj.title }}</strong></h4>
    
    <form method="POST" action="{% url 'update_tags' card.id %}">
        {% csrf_token %}
        
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: bold; margin-bottom: 4px;">Active Tags:</label>
            <textarea 
                readonly 
                rows="3" 
                style="width: 100%; background-color: #f5f5f5; border: 1px solid #ddd; padding: 8px; border-radius: 4px; resize: none;"
                placeholder="No tags applied to this item yet.">{% for tag in card.tags.all %}{{ tag.name }}{% if not forloop.last %}, {% endif %}{% endfor %}</textarea>
        </div>

        <div style="margin-bottom: 12px;">
            <label for="new-tags-{{ card.id }}" style="display: block; font-weight: bold; margin-bottom: 4px;">Add New Tags:</label>
            <input 
                type="text" 
                id="new-tags-{{ card.id }}"
                name="new_tags" 
                style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" 
                placeholder="e.g. vintage, rookie, 1989">
            <small style="color: #666; display: block; margin-top: 4px;">Separate multiple tags with commas.</small>
        </div>

        <button type="submit" style="background-color: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">
            Apply Changes
        </button>
    </form>
</div>
