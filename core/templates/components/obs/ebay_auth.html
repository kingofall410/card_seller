function initiateEbayAuth() {
    const btn = document.getElementById('ebay-auth-action-btn');

    const width = 600, height = 700;

    const top = (window.innerHeight / 2) - (height / 2);
    
    const authWindow = window.open(
        authUrl, 
        'eBayAPIAuthenticationPortal', 
        `width=${width},height=${height},top=${top},left=${left},scrollbars=yes,resizable=yes`
    );

    // 4. Set up an interval monitor checking if user completed login or abandoned the popup

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const authorizationCode = urlParams.get('code');

        if (authorizationCode) {
            // Forward authorization code token payload immediately to your server setup views
            fetch('/api/ebay/exchange-token/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken') // Django native validation token checks
                },
                body: JSON.stringify({ code: authorizationCode })
            })
            .then(res => {
                if(res.ok) {
                    // Close authentication interface layer window safely
                    window.close();
                }
            });
        } else {
            window.close();
        }
    });

    // Helper method to retrieve standard django security token strings from headers
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
