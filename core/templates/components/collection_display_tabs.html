<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/searchpanes/2.2.0/css/searchPanes.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/select/1.7.0/css/select.dataTables.min.css">

<div class="dashboard-container">
    <aside class="sidebar-panes">
        <div id="dynamic-sort-bar"></div>
        <div id="panes-container"></div>
    </aside>

    <main class="main-content">
        <header class="content-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div id="header-info-mount"></div>
            <div id="view-toggle-mount"></div>
        </header>
        
        <div id="visual-card-grid"></div>

        <!-- Split Content Layout: Datatable on Left, Static Preview Pane on Right -->
        <div class="main-content-split">
            <section class="content-primary">
                {% include "components/collection_datatable.html" %}
            </section>

            <aside class="content-preview-panel">
                <div class="preview-header">
                    <h3>Card Preview</h3>
                </div>
                <div class="dt-image-preview-static">
                    <!-- Static preview content rendered dynamically via JS -->
                </div>
            </aside>
        </div>

        <div id="infinite-loader">Loading more cards...</div>
    </main>
</div>
{% include "components/card_item_flat.html" %}

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/searchpanes/2.2.0/js/dataTables.searchPanes.min.js"></script>
<script src="https://cdn.datatables.net/select/1.7.0/js/dataTables.select.min.js"></script>

<script>
window.zoomState = {
    idColumnIndex: 14
};
let isApplyingServerUpdate = false;

(function($) { 
    const sortConfig = [
        { label: 'Natural', attrName: 'natural sort' },
        { label: 'Prices', attrName: 'all price sort' },
        { label: 'Full Name', attrName: 'full name' }, 
        { label: 'Year', attrName: 'year' }, 
        { label: 'Collection ID', attrName: 'collection' },  
        { label: 'Value ($)', attrName: 'value ($)' }, 
        { label: 'ID', attrName: 'id' },
        { label: 'Modified', attrName: 'modified' },
        { label: 'Task Time', attrName: 'task time' },
        { label: 'MSRP Only', attrName: 'msrp' },
        { label: 'List$ Only', attrName: 'list price' },
        { label: 'Total STR', attrName: 'str total' }
    ];
    
    let currentSort = { attrName: 'natural sort', attrIdx: null, dir: 'asc' };
    let loadingNextPage = false;

    // Global state tracking for card stacking
    let isCardStackingEnabled = true;

    // --- Dynamic Sort Bar Generation with Stacking Toggle ---
    function buildSortBar(tableApi, headerMap) {
        const bar = document.getElementById('dynamic-sort-bar');
        if (!bar) return;
        
        // Clear and build container structure
        bar.innerHTML = `
            <span class="sort-label">Display & Sort</span>
            <div class="stack-toggle-wrapper" style="margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid #eee;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; color: #333; font-weight: 500;">
                    <input type="checkbox" id="stack-toggle-checkbox" ${isCardStackingEnabled ? 'checked' : ''} style="cursor: pointer; width: 16px; height: 16px;">
                    Stack Duplicate Cards
                </label>
            </div>
            <span class="sort-label">Sort Collection</span>
        `;

        // Bind event listener to the stacking checkbox
        const stackCheckbox = document.getElementById('stack-toggle-checkbox');
        stackCheckbox.addEventListener('change', (e) => {
            isCardStackingEnabled = e.target.checked;
            // Trigger a DataTable redraw so the drawCallback re-evaluates stacking rules
            tableApi.draw(false);
        });

        // Render sort links
        sortConfig.forEach(cfg => {
            const targetIdx = headerMap[cfg.attrName];
            if (targetIdx === undefined) return; 

            const link = document.createElement('a');
            const isActive = currentSort.attrName === cfg.attrName;
            
            link.href = "javascript:void(0)"; 
            link.className = isActive ? 'active' : '';
            
            let arrow = isActive ? (currentSort.dir === 'asc' ? "▲" : "▼") : "—";
            link.innerHTML = `<span>${cfg.label}</span> <span style="opacity:0.4;">${arrow}</span>`;
            
            link.addEventListener('click', (e) => {
                e.preventDefault();
                currentSort.dir = isActive 
                    ? (currentSort.dir === 'asc' ? 'desc' : 'asc') 
                    : ((cfg.attrName === 'full name' || cfg.attrName === 'value ($)') ? 'desc' : 'asc');
                
                currentSort.attrName = cfg.attrName;
                currentSort.attrSortIdx = targetIdx;
                
                tableApi.order([[targetIdx, currentSort.dir]]).page.len(50).draw();
                buildSortBar(tableApi, headerMap);
            });
            
            bar.appendChild(link);
        });
    }

    // --- DOUBLE-CLICK URL TARGETING ENGINE ---
    $(document).on('dblclick', '.dtsp-searchPane table tbody tr', function (e) {
        e.preventDefault();
        const $row = $(this);
        const targetValue = $row.find('.dtsp-name').text().trim();
        const selection = targetValue || $row.find('td').first().text().trim();
        if (!selection) return;

        const currentUrl = new URL(window.location.href);
        const basePath = currentUrl.pathname;
        const parentSelection = currentUrl.searchParams.get('timeframe') || '30';
        const targetTargetUrl = `${basePath}?q=${selection}&timeframe=${parentSelection}`;

        console.log(`Opening Drill-Down View: ${targetTargetUrl}`);
        window.open(targetTargetUrl, '_blank');
    });

    // =====================================================================
    // CORE INITIALIZATION ENGINE PASS
    // =====================================================================
    $(document).ready(function() {
        const grid = $('#visual-card-grid');
        const loader = $('#infinite-loader');
        const $previewBox = $('#dt-row-hover-preview');
        const $previewImg = $previewBox.find('img');
        
        // Build the Header Map Dictionary straight from the DOM table elements
        const headerMap = {};
        $('#card-data-engine thead th').each(function(idx) {
            const text = $(this).text().trim().toLowerCase();
            headerMap[text] = idx;
        });

        const idxGroup = headerMap['groups'] !== undefined ? headerMap['groups'] : 14; 
        
        const idxYear = headerMap['year'] !== undefined ? headerMap['year'] : 3;
        const idxBrand = headerMap['brand'] !== undefined ? headerMap['brand'] : 4;
        const idxSubset = headerMap['subset'] !== undefined ? headerMap['subset'] : 5;
        const idxCardName = headerMap['card name'] !== undefined ? headerMap['card name'] : 6;
        const idxParallel = headerMap['parallel'] !== undefined ? headerMap['parallel'] : 7;
        const idxName = headerMap['full name'] !== undefined ? headerMap['full name'] : 8;
        const idxCardNr = headerMap['card number'] !== undefined ? headerMap['card number'] : 9;
        const idxCity = headerMap['city'] !== undefined ? headerMap['city'] : 10;
        const idxTeamName = headerMap['team'] !== undefined ? headerMap['team'] : 11;
        const idxStatus = headerMap['overall status'] !== undefined ? headerMap['overall status'] : 2; 

        const idxCollId = headerMap['collection id'] !== undefined ? headerMap['collection id'] : 12;
        const idxValue = headerMap['Value ($)'] !== undefined ? headerMap['Value ($)'] : 13;
        const idxId = headerMap['id'] !== undefined ? headerMap['id'] : 1;
        const idxModDate = headerMap['modified'] !== undefined ? headerMap['modified'] : 24;  
        const idxValueRange = headerMap['val range'] !== undefined ? headerMap['val range'] : 15;   
        const idxFrontUrl = headerMap['front url'] !== undefined ? headerMap['front url'] : 16; 
        const idxCsrId = headerMap['csr id'] !== undefined ? headerMap['csr id'] : 17;
        const idxTaskTime = headerMap['task time'] !== undefined ? headerMap['task time'] : 18;
        
        const idxReverseUrl = headerMap['reverse url'] !== undefined ? headerMap['reverse url'] : 19;
        const idxFrontHdUrl = headerMap['front'] !== undefined ? headerMap['front'] : 20;
        const idxReverseHdUrl = headerMap['reverse'] !== undefined ? headerMap['reverse'] : 21;
        const idxListPrice = headerMap['list price'] !== undefined ? headerMap['list price'] : 23;
        const idxMSRP = headerMap['MSRP'] !== undefined ? headerMap['MSRP'] : 22;
        const idxCondition = headerMap['condition'] !== undefined ? headerMap['condition'] : 14;
        const idxQty = headerMap['qty'] !== undefined ? headerMap['qty'] : 25;
        
        const idxDTSOverall = headerMap['DTSO'] !== undefined ? headerMap['DTSO'] : 26;
        const idxDTSRecent = headerMap['DTSR'] !== undefined ? headerMap['DTSR'] : 27;
        const idxNaturalSort = headerMap['natural sort'] !== undefined ? headerMap['natural sort'] : 28;
        const idxSalesOverall = headerMap['SalesO'] !== undefined ? headerMap['SalesO'] : 29;
        const idxSalesRecent = headerMap['SalesR'] !== undefined ? headerMap['SalesR'] : 30;

        const idxRawSoldCount = headerMap['raw sold count'] !== undefined ? headerMap['raw sold count'] : 31;
        const idxRawRecentSoldCount = headerMap['raw recent sold count'] !== undefined ? headerMap['raw recent sold count'] : 32;
        const idxAvailOverall = headerMap['AvailableO'] !== undefined ? headerMap['AvailableO'] : 33;
        const idxSTRRDayCount = headerMap['STR Recent Days'] !== undefined ? headerMap['STR Recent Days'] : 34;
        const idxConditionRecentDate = headerMap['Condition Recent Date'] !== undefined ? headerMap['Condition Recent Date'] : 35;
        
        const idxRawRecentDate = headerMap['Raw Recent Date'] !== undefined ? headerMap['Raw Recent Date'] : 36;
        const idxSTRTDayCount = headerMap['STR Overall Days'] !== undefined ? headerMap['STR Overall Days'] : 37;
        const idxRawOverallDate = headerMap['Raw Overall Date'] !== undefined ? headerMap['Raw Overall Date'] : 38;
        const idxConditionOverallDate = headerMap['Condition Overall Date'] !== undefined ? headerMap['Condition Overall Date'] : 39;
        const idxConditionRecentAvail = headerMap['Condition recent avail'] !== undefined ? headerMap['Condition recent avail'] : 40;
        const idxRawSoldRecentAvail = headerMap['raw sold recent avail'] !== undefined ? headerMap['raw sold recent avail'] : 41;
        const idxRecentAvail = headerMap['AvailableR'] !== undefined ? headerMap['AvailableR'] : 42;
        
        currentSort.attrIdx = idxNaturalSort;
        // =====================================================================
        // ADVANCED BACKEND PIPELINE STATES & LEDGERS
        // =====================================================================
        const selectedIds = new Set(); // Single source of truth for checkbox state
        const quickEditQueue = [];     // FIFO Pipeline array tracking database write tasks
        
        let isProcessingQueue = false;
        let activeFocusLock = null;    // Remembers caret offset locations during optimistic redraws
        let quickEditDebounceTimer = null;

        // Separate cross-view tracking layers for shift clicks
        let lastClickedTableIndex = null;
        let lastClickedGridIndex = null;

        // Configure search pane categories for tracking
        const searchPaneConfigs = [
            { key: 'brand', colIdx: idxBrand },
            { key: 'subset', colIdx: idxSubset },
            { key: 'parallel', colIdx: idxParallel },
            { key: 'product_group_name', colIdx: idxGroup },
            { key: 'parallel', colIdx: idxParallel },
            { key: 'condition', colIdx: idxCondition },
            { key: 'subset', colIdx: idxSubset },
            { key: 'card_name', colIdx: idxCardName },
            { key: 'city', colIdx: idxCity },
            { key: 'team', colIdx: idxTeamName }
        ];

        // Initialize frequency maps for each configuration
        const countsMaps = {};
        searchPaneConfigs.forEach(pane => {
            countsMaps[pane.key] = {};
        });

        // Map initial payload AND tally frequencies simultaneously in a single pass
        const preloadedCardsList = [];
        $('#card-data-engine tbody tr').each(function() {
            const $tds =$(this).find('td');
            const card = {
                id: $tds.eq(idxId).text().trim(),
                csr_id: $tds.eq(idxCsrId).text().trim(),
                name: $tds.eq(idxName).text().trim(),
                year: $tds.eq(idxYear).text().trim(),
                brand: $tds.eq(idxBrand).text().trim(),
                value: $tds.eq(idxValue).text().trim(),
                city: $tds.eq(idxCity).text().trim(),
                team: $tds.eq(idxTeamName).text().trim(),
                subset: $tds.eq(idxSubset).text().trim(),
                card_name: $tds.eq(idxCardName).text().trim(),
                overall_status: $tds.eq(idxStatus).text().trim(),
                collection_id: $tds.eq(idxCollId).text().trim(),
                product_group_name: $tds.eq(idxGroup).text().trim(),
                front_url: $tds.eq(idxFrontUrl).text().trim(),
                reverse_url: $tds.eq(idxReverseUrl).text().trim(),
                parallel: $tds.eq(idxParallel).text().trim(),
                msrp: $tds.eq(idxMSRP).text().trim(),
                list_price: $tds.eq(idxListPrice).text().trim(),
                task_time: $tds.eq(idxTaskTime).text().trim(),
                legacy_msrp: $tds.eq(idxMSRP).text().trim(),
                qty: $tds.eq(idxQty).text().trim(),
                strt: $tds.eq(idxDTSOverall).text().trim(),
                condition: $tds.eq(idxCondition).text().trim(),
                natural_sort: $tds.eq(idxNaturalSort).text().trim(),
            };
            
            preloadedCardsList.push(card);

            // Inline frequency tallying
            searchPaneConfigs.forEach(pane => {
                const val = card[pane.key];
                if (val !== undefined && val !== '') {
                    const map = countsMaps[pane.key];
                    map[val] = (map[val] || 0) + 1;
                }
            });
        });

        console.debug('[Card Engine Debug] Preloaded cards parsed and tallied inline:', preloadedCardsList.length);

        // Sort, slice top 10, and build custom options array post-loop
        const combinedTopOptions = [];
        searchPaneConfigs.forEach(pane => {
            const countsMap = countsMaps[pane.key];
            const sortedVals = Object.entries(countsMap)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            console.debug(`[Card Engine Debug] Top 10 SearchPane options for ${pane.key}:`, sortedVals);

            sortedVals.forEach(([val, count]) => {
                combinedTopOptions.push({
                    label: `${val}`,
                    value: function(rowData, rowIdx) {
                        return rowData[pane.colIdx] === val;
                    }
                });
            });
        });

        console.debug('[Card Engine Debug] Total combined top options generated (Inline):', combinedTopOptions.length);

        /**
        * Synchronizes state parameters exactly across UI visibility paradigms.
        */
        function renderCheckboxUI() {
            // Sync the Table body checkboxes
            $('#card-data-engine tbody .dt-row-chk').each(function() {
                const id = $(this).data('id');
                const isChecked = selectedIds.has(id);
                $(this).prop('checked', isChecked);
                $(this).closest('tr').toggleClass('selected', isChecked);
            });

            // Sync the Grid checkboxes
            $('#visual-card-grid .card-item').each(function() {
                const id = $(this).data('id');
                const isChecked = selectedIds.has(id);
                $(this).find('.card-chk-input').prop('checked', isChecked);
            });

            // Sync the Master Header Checkbox
            const $tableCheckboxes = $('#card-data-engine tbody .dt-row-chk');
            const total = $tableCheckboxes.length;
            let checkedCount = 0;
            
            $tableCheckboxes.each(function() {
                if (selectedIds.has($(this).data('id'))) checkedCount++;
            });


            // 2. Directly update the text of the info element
            $('.dataTables_info').text(
                `Showing ${total} (${checkedCount} selected)`
            );
            
            const $masterChk = $('#select-all-table');
            if (total === 0) {
                $masterChk.prop('checked', false).prop('indeterminate', false);
            } else if (checkedCount === total) {
                $masterChk.prop('checked', true).prop('indeterminate', false);
            } else if (checkedCount === 0) {
                $masterChk.prop('checked', false).prop('indeterminate', false);
            } else {
                $masterChk.prop('checked', false).prop('indeterminate', true);
            }
            
        }

        /* --- Unified Checkbox Core Event Actions --- */

        // Master Header Toggle
        $('#select-all-table').on('click', function() {
            const isChecked = $(this).is(':checked');
            
            $('#card-data-engine tbody .dt-row-chk').each(function() {
                const id = $(this).data('id');
                if (isChecked) {
                    selectedIds.add(id);
                } else {
                    selectedIds.delete(id);
                }
            });
            renderCheckboxUI();
        });

        // Table Component Click and Shift Select Block
        $('#card-data-engine tbody').on('click', '.dt-row-chk', function(e) {
            const $checkboxes = $('#card-data-engine tbody .dt-row-chk');
            const currentIndex = $checkboxes.index(this);
            const targetId = $(this).data('id');
            const isChecked = $(this).is(':checked'); 

            if (e.shiftKey && lastClickedTableIndex !== null) {
                const start = Math.min(lastClickedTableIndex, currentIndex);
                const end = Math.max(lastClickedTableIndex, currentIndex);

                $checkboxes.slice(start, end + 1).each(function() {
                    const id = $(this).data('id');
                    if (isChecked) selectedIds.add(id);
                    else selectedIds.delete(id);
                });
                window.getSelection().removeAllRanges();
            } else {
                if (isChecked) selectedIds.add(targetId);
                else selectedIds.delete(targetId);
            }

            lastClickedTableIndex = currentIndex;
            renderCheckboxUI(); 
        });

        // Grid Component Click and Shift Select Block
        $('#visual-card-grid').on('click', '.card-chk-input', function(e) {
            const $checkboxes = $('#visual-card-grid .card-chk-input');
            const currentIndex = $checkboxes.index(this);
            const targetId = $(this).closest('.card-item').data('id');
            const isChecked = $(this).is(':checked');

            if (e.shiftKey && lastClickedGridIndex !== null) {
                const start = Math.min(lastClickedGridIndex, currentIndex);
                const end = Math.max(lastClickedGridIndex, currentIndex);

                $checkboxes.slice(start, end + 1).each(function() {
                    const id = $(this).closest('.card-item').data('id');
                    if (isChecked) selectedIds.add(id);
                    else selectedIds.delete(id);
                });
                window.getSelection().removeAllRanges();
            } else {
                if (isChecked) selectedIds.add(targetId);
                else selectedIds.delete(targetId);
            }

            lastClickedGridIndex = currentIndex;
            renderCheckboxUI(); 
        });

        // Fallback change event layer tracking
        $('#visual-card-grid').on('change', '.card-chk-input', function() {
            const isChecked = $(this).is(':checked');
            const id = $(this).closest('.card-item').data('id');
            $(`.dt-row-chk[data-id="${id}"]`).prop('checked', isChecked);
        });

        // Infinite Stream Handler
        $(window).on('scroll', function() {
            if (loadingNextPage || $('#visual-card-grid').is(':hidden')) return;

            const distanceToBottom = $(document).height() - ($(window).scrollTop() + $(window).height());
            if (distanceToBottom <= 250) {
                const api = $('#card-data-engine').DataTable();
                const info = api.page.info();

                if (info.page < info.pages - 1) {
                    loadingNextPage = true;
                    loader.text("Streaming next assets...").show();

                    setTimeout(() => {
                        api.page.len(api.page.len() + 50).draw(false);
                        loadingNextPage = false;
                        loader.hide();
                    }, 300);
                }
            }
        });
        
        // Inject initial data structural elements safely 
        if (grid.length > 0 && typeof drawOrHydrateCardComponent === 'function') {
            preloadedCardsList.forEach(card => {
                const $compiledComponent = drawOrHydrateCardComponent(card);
                grid.append($compiledComponent);
            });
        }

        // Cell template generator targets
        function createPersistentInputRenderer(safeData) {
            const cleanVal = safeData ? safeData.toString().replace(/"/g, '&quot;') : '';
            return `<input type="text" class="dt-inline-edit" value="${cleanVal}" data-current="${cleanVal}">`;
        }
        
        function createLinkRenderer(safeData, row) {
            const cleanVal = safeData ? safeData.toString().replace(/"/g, '&quot;') : '';
            return `<a href="/card/${row[idxId]}" target="_blank" style="text-decoration:none;">${cleanVal}</a>`;
        }
        
        function createCurrencyRenderer(safeData, row) {
            console.debug('[CurrencyRenderer] Input safeData:', safeData);

            const cleanVal = safeData ? safeData.toString().replace(/^\$/, '').trim() : '';
            const num = parseFloat(cleanVal);

            console.debug('[CurrencyRenderer] Cleaned string:', cleanVal, '| Parsed number:', num);

            if (isNaN(num)) {
                console.debug('[CurrencyRenderer] Value is not a valid number, fallback to raw string');
                return safeData ? `$${safeData}` : '';
            }

            const formatted = `$${num.toFixed(2)}`;
            const result = `<input type="text" class="dt-inline-edit"  style="text-align: right; width: 100%;" value="${formatted}">`;
            console.debug('[CurrencyRenderer] Final formatted currency:', result);
            
            return result;
        }
        
        function createLinkRenderer(safeData, row) {
            const cleanVal = safeData ? safeData.toString().replace(/"/g, '&quot;') : '';
            return `<a href="/card/${row[idxId]}" target="_blank" style="text-decoration:none;">${cleanVal}</a>`;
        }

        function createImageRenderer(safeData) {
            return `<img src="${safeData}" class="lazy-table-img" data-thumb="${safeData}">`;
        }

        function createSoldCountRenderer(safeData, row, colIdx) {
            //console.log("sold count renderer", safeData, row, colIdx)
            if (row[idxSalesOverall] != "0")//there are applicable overall sales, show the specifed count with condition
                return `<input type="text" class="dt-inline-edit" value="${row[colIdx]} (${row[idxCondition]})" data-current="${row[colIdx]} (${row[idxCondition]})">`;
            else if (row[idxCondition] != "")//condition is specified but no applicable sales, go to RW -->
                return `<input type="text" class="dt-inline-edit" value="${row[colIdx+2]} (RW)" data-current="${row[colIdx+2]} (RW)">`;
            else 
                return `<input type="text" class="dt-inline-edit" value="${row[colIdx+2]}" data-current="${row[colIdx+2]}">`;
        }
        
        function createAvailCountRenderer(safeData, row, colIdx) {
            //console.log("avail count renderer", safeData, row, colIdx)
            if (row[idxSalesOverall] != "0")
                return `<input type="text" class="dt-inline-edit" value="${row[colIdx-2]} (${row[idxCondition]})" data-current="${row[colIdx-2]}  (${row[idxCondition]})">`;
            else if (row[idxCondition] != "")
                return `<input type="text" class="dt-inline-edit" value="${row[colIdx-1]} (RW)" data-current="${row[colIdx-1]} (RW)">`;
            else 
                return `<input type="text" class="dt-inline-edit" value="${row[colIdx-1]}" data-current="${row[colIdx-1]}">`;
        }

        function createDTSRenderer(safeData, row, colIdx) {
            console.log("dts renderer", safeData, row, colIdx)
            const num1 = parseFloat(row[colIdx], 10) || 0;
            let num2
            if (colIdx == idxDTSOverall) {
                num2 = parseFloat(row[idxSTRTDayCount], 10) || 0; 
            } else {
                num2 = parseFloat(row[idxSTRRDayCount], 10) || 0; 
            }
            console.log(num2, num1)
            const result = Math.round(num2 / num1);
            
            return `<input type="text" class="dt-inline-edit" value="${result}" data-current="${row[colIdx]} (${row[colIdx+7]})">`;
        }

        // [Debug] Initializing Spreadsheet-like Input Focus Metadata Context Preservation Engine
        // =====================================================================
        // INPUT FOCUS METADATA CONTEXT PRESERVATION ENGINE
        // =====================================================================
        $('#card-data-engine')
            .on('focusin', '.dt-inline-edit', function() {
                const tableApi = $('#card-data-engine').DataTable();
                const $input = $(this);
                const cellIdx = tableApi.cell($input.closest('td')).index();
                
                // FIX: Reliable header parsing that safely handles malformed text strings
                const textContent = tableApi.column(cellIdx.column).header().textContent || $(tableApi.column(cellIdx.column).header()).text();
                const columnName = textContent.trim().toLowerCase().replace(/\s+/g, '_');
                const rowData = tableApi.row(cellIdx.row).data();

                activeFocusLock = {
                    id: rowData[idxId],
                    columnName: columnName,
                    selectionStart: this.selectionStart
                };
                console.log(`[Debug] Focus Locked on ID: ${activeFocusLock.id}, Column: ${columnName}`);
            })
            .on('focusout', '.dt-inline-edit', function() {
                // Allow short timeout so click events or tab movements settle before clearing the lock
                setTimeout(() => {
                    if (!document.activeElement.classList.contains('dt-inline-edit')) {
                        activeFocusLock = null;
                    }
                }, 50);
            });

        function restoreInputFocusLock(tableApi) {
            if (!activeFocusLock) return;

            const targetRowIdx = tableApi.rows().indexes().filter((idx) => {
                return tableApi.row(idx).data()[idxId] == activeFocusLock.id;
            })[0];

            if (targetRowIdx === undefined) return;

            const targetColIdx = tableApi.columns().header().toArray().findIndex(header => {
                return $(header).text().trim().toLowerCase().replace(/\s+/g, '_') === activeFocusLock.columnName;
            });

            if (targetColIdx !== -1) {
                const cellNode = tableApi.cell(targetRowIdx, targetColIdx).node();
                const $input = $(cellNode).find('.dt-inline-edit');
                
                if ($input.length && !$input.is(':focus')) {
                    console.log(`[Debug] Restoring focus to ID: ${activeFocusLock.id}`);
                    $input.focus();
                    if ($input[0].setSelectionRange && activeFocusLock.selectionStart !== null) {

        // =====================================================================
        // ASYNC FIFO OPTIMISTIC SYNCHRONIZATION TRANSACTION QUEUE
        // =====================================================================
        async function processQuickEditQueue() {
            if (isProcessingQueue || quickEditQueue.length === 0) return;
            isProcessingQueue = true;

            const tableApi = $('#card-data-engine').DataTable();
            const nextPayload = quickEditQueue.shift();
            const originalPristineValues = {}; 

            console.log(`[Optimistic UI] Mutating fields locally for asset: ${nextPayload.csrId}`);
            const allTargetCsrIds = [nextPayload.csrId, ...nextPayload.mirroredCsrIds].map(String);
            const normalizedColName = nextPayload.column.replace(/_/g, ' ').toLowerCase();
            const colIdx = headerMap[normalizedColName];

            if (colIdx === undefined) {
                console.error(`[Debug] Column index missing mapping for field name: ${nextPayload.column}`);
                isProcessingQueue = false;
                return processQuickEditQueue();
            }

            // STAGE A: Spreadsheet Optimization: Read and mutate DOM elements instantly *before* forcing internal data updates.
            tableApi.rows().every(function(idx) {
                const d = this.data();
                const rowCsrId = String(d[idxCsrId]);

                if (allTargetCsrIds.includes(rowCsrId)) {
                    // Cache current state safely 
                    if (!originalPristineValues[rowCsrId]) {
                        const currentInput = $(this.node()).find(`td:eq(${colIdx}) .dt-inline-edit`);
                        originalPristineValues[rowCsrId] = currentInput.attr('data-current') || currentInput.val() || '';
                    }

                    // Update underlying cache array references
                    d[colIdx] = nextPayload.value; 
                    
                    // CRITICAL FIX: Update the specific cell node's value visually without triggering a destructive full-row data loop
                    const cellNode = tableApi.cell(idx, colIdx).node();
                    const $cellInput = $(cellNode).find('.dt-inline-edit');
                    if ($cellInput.length && $cellInput.val() !== nextPayload.value) {
                        $cellInput.val(nextPayload.value);
                    }

                    const $cellNode = $(cellNode);
                    $cellNode.addClass('dt-cell-committed');
                    setTimeout(() => $cellNode.removeClass('dt-cell-committed'), 800);
                }
            });

            // STAGE B: Database Server Persistence Execution Loop
            try {
                console.log(`[Debug] Dispatching optimistic sync payload to server for CSR: ${nextPayload.csrId}`);

                const response = await $.ajax({
                    url: "/bulk_update_csr_fields/",
                    method: "POST",
                    contentType: "application/json",
                    headers: { 'X-CSRFToken': (typeof CardLiveFeedUpdater !== 'undefined' ? CardLiveFeedUpdater.getCsrfToken() : '') },
                    data: JSON.stringify({ 
                        updates: [{ csrId: nextPayload.csrId, allFields: { [nextPayload.column]: nextPayload.value, [nextPayload.column+"_is_manual"]: true} }] 
                    } )
                });

                console.log("[Background Sync] Server persistence successful:", response.results);

                // STAGE C: Post-flight baseline adjustments. Refresh metadata without clearing inputs.
                tableApi.rows().every(function(idx) {
                    const d = this.data();
                    const rowCsrId = String(d[idxCsrId]);

                    if (allTargetCsrIds.includes(rowCsrId)) {
                        const cellNode = tableApi.cell(idx, colIdx).node();
                        const $cellInput = $(cellNode).find('.dt-inline-edit');
                        if ($cellInput.length) {
                            $cellInput.attr('data-current', nextPayload.value);
                        }
                    }
                });

            } catch (xhr) {
                console.error("[CRITICAL BACKGROUND ERROR] Server sync rejected:", xhr.responseText);
                
                // AUTOMATIC SAFETY TRANSACTIONAL DATA ROLLBACK
                tableApi.rows().every(function(idx) {
                    const d = this.data();
                    const rowCsrId = String(d[idxCsrId]);

                    if (allTargetCsrIds.includes(rowCsrId) && originalPristineValues[rowCsrId] !== undefined) {
                        const revertVal = originalPristineValues[rowCsrId];
                        d[colIdx] = revertVal;
                        
                        const cellNode = tableApi.cell(idx, colIdx).node();
                        const $cellInput = $(cellNode).find('.dt-inline-edit');
                        if ($cellInput.length) {
                            $cellInput.val(revertVal).attr('data-current', revertVal);
                        }
                    }
                });

                // Only redraw on total failure states
                tableApi.draw(false);
                restoreInputFocusLock(tableApi);
                alert("Background update sync failed. Row values have been safely rolled back.");
            } finally {
                isProcessingQueue = false;
                processQuickEditQueue(); 
            }
        }

                    let baseQty = 1;
                    if ($card.attr('data-base-qty') !== undefined) {
                        baseQty = parseInt($card.attr('data-base-qty'), 10) || 1;
                    } else {
                        // Read from current badge if present
                        const $badge =$card.find('.duplicate-qty-badge');
                        if ($badge.length) {
                            const badgeText = $badge.text().trim();
                            const parsed = parseInt(badgeText.replace(/^x/i, ''), 10);
                            if (!isNaN(parsed)) baseQty = parsed;
                        }
                        // Save it securely as the immutable base quantity so stack sums never overwrite it
                        $card.attr('data-base-qty', baseQty);
                    }
                    cardBaseQtys[item.id] = baseQty;
                });

                // Step 2: Pre-calculate stack counts and total aggregated base quantities per NaturalSort group
                const sortCounts = {};
                const sortTotalQty = {};
                
                currentPageRows.forEach(item => {
                    if (item.naturalSort !== '') {
                        sortCounts[item.naturalSort] = (sortCounts[item.naturalSort] || 0) + 1;
                        const cardQty = cardBaseQtys[item.id] || 1;
                        sortTotalQty[item.naturalSort] = (sortTotalQty[item.naturalSort] || 0) + cardQty;
                    }
                });

                console.log("current page rows data:", currentPageRows);

                const currentPageIds = [];
                let prevNaturalSort = null;

                currentPageRows.forEach((item, index) => {
                    if (!item.id) return;
                    currentPageIds.push(item.id);

                    const $card = grid.find(`.card-item[data-id="${item.id}"]`);
                    const count = sortCounts[item.naturalSort] || 1;
                    const baseQty = cardBaseQtys[item.id] || 1;
                    
                    // Evaluate duplicate grouping only if stacking is enabled
                    const isDuplicate = isCardStackingEnabled && (item.naturalSort !== '' && item.naturalSort === prevNaturalSort);
                    const $badgeMount =$card.find('.qty-badge-mount');

                    if (isDuplicate) {
                        // Hide subsequent duplicate cards so they don't occupy grid space
                        $card.addClass('card-stack-subsequent').hide();
                        console.debug(`[CardStack] Condensing duplicate card ID ${item.id} (NaturalSort: ${item.naturalSort})`);
                    } else {
                        const isStackHead = isCardStackingEnabled && (count > 1);

                        if (isStackHead) {
                            $card.addClass('card-stacked card-stack-first').attr('data-stack-count', count);
                        } else {
                            $card.removeClass('card-stacked card-stack-first card-stack-subsequent').removeAttr('data-stack-count');
                        }

                        // Determine display quantity: combined stack total if stacked, or pristine baseQty if unstacked
                        const displayQty = isStackHead ? (sortTotalQty[item.naturalSort] || baseQty) : baseQty;

                        // Render badge: full badge if > 1, '+' trigger if 1
                        const badgeHtml = displayQty > 1 
                            ? `<div class="duplicate-qty-badge" title="Quantity: ${displayQty}">x${displayQty}</div>` 
                            : `<div class="qty-add-trigger" title="Set Quantity">+</div>`;
                        
                        $badgeMount.html(badgeHtml);

                        // Append and display the card
                        $card.show().appendTo(grid);
                    }

                    prevNaturalSort = isCardStackingEnabled ? item.naturalSort : null;
                });

                console.log("current page ids:", currentPageIds);
                sessionStorage.setItem('card_sequence', JSON.stringify(currentPageIds));
                
                setTimeout(() => { 
                    grid.removeClass('filtering-active');
                    $('.dtsp-searchPane').removeClass('pane-processing');
                    if (!loadingNextPage) {
                        $('#infinite-loader').hide(); 
                    }

                    // --- SYNC PREVIEW PANE TO FIRST ROW ---
                    if (!$('.content-preview-panel').hasClass('layout-hidden')) {
                        const $firstRow =$('#card-data-engine tbody tr:visible').first();
                        if ($firstRow.length) {
                            console.debug("[Preview] Triggering hover on first visible row from drawCallback.");
                            $firstRow.trigger('mouseenter');
                        } else {
                            $('.dt-image-preview-static').html('<p style="color: #666; font-size: 13px; text-align: center; padding: 20px;">No preview available</p>');
                        }
                    }
                }, 150);
            }
        }); 
        const $paneElements = $('#panes-container .dtsp-searchPane');
        if ($paneElements.length > 0) {
            $paneElements.last().insertBefore($paneElements.first());
            console.debug('[Card Engine Debug] Custom SearchPane successfully relocated to the top.');
        } else {
            console.debug('[Card Engine Debug] Warning: SearchPane elements not found during rearrangement.');
        }
        // =====================================================================
        // SPREADSHEET-STYLE CELL EDIT INTERACTION PIPELINE
        // =====================================================================
        // [DEBUG LOG] Attaching change tracking to commit values on blur boundary
        console.log("[Debug] Initializing spreadsheet focus-commit interaction loops.");

        $('#card-data-engine tbody').on('change', '.dt-inline-edit', function() {
            const $input = $(this);
            const updatedVal = $input.val().trim();
            const originalVal = $input.attr('data-current');
            
            // If the text hasn't changed, exit early without spinning up the engine
            if (updatedVal === originalVal) return;

            console.log(`[Debug] Cell value changed from "${originalVal}" to "${updatedVal}". Queueing payload execution.`);

            const tableApi = $('#card-data-engine').DataTable();
            const cellIdx = tableApi.cell($input.closest('td')).index();
            const columnName = tableApi.column(cellIdx.column).header().textContent.trim().toLowerCase().replace(' ', '_');
            const editedRowData = tableApi.row(cellIdx.row).data();
            const editedCsrId = editedRowData[idxCsrId].toString().trim();
            const activeSelectedIds = Array.from(selectedIds);

            const changePayload = {
                csrId: editedCsrId,
                column: columnName,
                value: updatedVal,
                mirroredCsrIds: []
            };

            // Mirror values immediately to matching checked elements across the table grid
            tableApi.rows().indexes().each((idx) => {
                const rData = tableApi.row(idx).data();
                if (activeSelectedIds.includes(rData[idxId]) && rData[idxCsrId] !== editedCsrId) {
                    changePayload.mirroredCsrIds.push(rData[idxCsrId]);
                    
                    const targetedCell = tableApi.cell(idx, cellIdx.column);
                    $(targetedCell.node()).find('.dt-inline-edit').val(updatedVal);
                }
            });

            // Fire debounce immediately since focus has already dropped from the input node
            clearTimeout(quickEditDebounceTimer);
            quickEditDebounceTimer = setTimeout(() => {
                quickEditQueue.push(changePayload);
                processQuickEditQueue();
            }, 100); 
        });

        // [DEBUG LOG] Initializing arrow-key & Enter navigation with image sync
        console.log("[Debug] Attaching Enter-key navigation and tooltip sync handler.");

        $('#card-data-engine tbody').on('keydown', '.dt-inline-edit', function(evt) {
            if (evt.which === 13) { 
                evt.preventDefault(); 
                
                const $currentInput = $(this);
                const $currentTd = $currentInput.closest('td');
                const colIdx = $currentTd.index(); 
                const $currentRow = $currentTd.closest('tr');
                const $nextRow = $currentRow.next('tr'); 

                console.log(`[Debug] Enter pressed on row: ${$currentRow.index()}, col: ${colIdx}. Committing cell.`);

                // Force input blur to trigger the 'change' commitment process cleanly
                $currentInput.blur(); 

                if ($nextRow.length) {
                    const $nextInput = $nextRow.find(`td:eq(${colIdx}) .dt-inline-edit`);
                    if ($nextInput.length) {
                        console.log(`[Debug] Moving focus down to row: ${$nextRow.index()}.`);
                        $nextInput.focus(); 
                        $nextInput.trigger('mouseenter'); 
                    }
                }
            } else if (evt.which === 27) { 
                evt.preventDefault(); 
                console.log("[Debug] Escape pressed. Reverting change.");
                // Reset value back to original pristine state element marker
                $(this).val($(this).attr('data-current')).blur(); 
            }
        });

        $('#card-data-engine tbody').on('focus', '.dt-inline-edit', function() {
            const $input = $(this);
            const rowIndex = $input.closest('tr').index();
            
            console.log(`[Debug] Input focused on row ${rowIndex}. Queueing full text selection.`);
            
            // Deliberately windowed to capture cell focus targets immediately ahead of redraw loops
            setTimeout(function() {
                console.log(`[Debug] Forcing text selection now for row ${rowIndex}.`);
                $input.select();
            }, 25); 
        });

    });
})(jQuery);

</script>
