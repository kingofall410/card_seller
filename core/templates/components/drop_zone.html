<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Process Card Scans</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background-color: #fdfdfd;
        }

        #dropzone {
            width: 450px;
            height: 220px;
            position: relative;
            border: 3px dashed #888;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
        }

        #dropzone.dragover {
            border-color: #28a745;
            color: #28a745;
            background: #f4fbf6;
        }
    
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-active {
            pointer-events: none;
            background-color: #f8f9fa !important;
            border-color: #ccc !important;
        }

        #results {
            margin-top: 30px;
            max-width: 800px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: none;
            background: #fff;
        }
    </style>
</head>
<body>

<h2>Card Detection Pipeline Interface</h2>
<p style="color: #666; max-width: 500px;">
    Drop marketplace screenshots, card piles, or crop grids here. The backend will process bounding boxes and isolate individual cards.
</p>

<div id="dropzone">
    Drop, click, or paste scan images to run pipeline
</div>

<input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
<input type="hidden" id="collectionId" value="{{ collection_id }}">

<div id="results"></div>

<script>
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const results = document.getElementById("results");
    const collectionId = document.getElementById("collectionId").value;

    // --- DEBUG LOG ---
    // UI Event Track: Initializing processing hooks for dropzone
    // Action: Swapping destination endpoint to target backend card-extraction pipelines

    function showSpinnerOnButton(button) {
        button.originalText = button.innerHTML;
        button.classList.add('loading-active');

        const container = document.createElement('div');
        container.style.textAlign = 'center';

        const spinner = document.createElement('span');
        spinner.style.display = 'block';
        spinner.style.margin = '0 auto 10px auto';
        spinner.style.width = '35px';
        spinner.style.height = '35px';
        spinner.style.border = '4px solid #f3f3f3';
        spinner.style.borderTop = '4px solid #28a745';
        spinner.style.borderRadius = '50%';
        spinner.style.animation = 'spin 0.8s linear infinite';

        const text = document.createElement('div');
        text.innerText = 'Running Computer Vision Pipeline...';
        text.style.color = '#333';
        text.style.fontSize = '14px';

        container.appendChild(spinner);
        container.appendChild(text);

        button.innerHTML = '';
        button.appendChild(container);
    }

    function restoreButton(button) {
        button.innerHTML = button.originalText;
        button.classList.remove('loading-active');
    }

    // Click → open file picker
    dropzone.addEventListener("click", () => fileInput.click());

    // Drag events
    dropzone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => {
        dropzone.classList.remove("dragover");
    });

    dropzone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropzone.classList.remove("dragover");
        if (e.dataTransfer.files.length > 0) {
            uploadAndProcessImages(e.dataTransfer.files);
        }
    });

    // File picker change
    fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) {
            uploadAndProcessImages(fileInput.files);
        }
    });

    // Clipboard paste intercept loop
    document.addEventListener("paste", (e) => {
        const items = e.clipboardData.items;
        for (let item of items) {
            if (item.type.startsWith("image/")) {
                const blob = item.getAsFile();
                const filename = `scan_paste_${Date.now()}.png`;
                const file = new File([blob], filename, { type: blob.type });
                uploadAndProcessImages([file]);
            }
        }
    });

    function uploadAndProcessImages(files) {
        showSpinnerOnButton(dropzone);
        results.style.display = "none";

        const form = new FormData();
        form.append("collection_id", collectionId);
        
        // Appending image payloads to matching multipart parser key
        for (let f of files) {
            form.append("images", f);
        }

        // --- FETCH INVOCATION ROUTINE ---
        // Hits your new Django/Flask pipeline processor view
        fetch(`/services/process_scans/`, {
            method: "POST",
            body: form
        })
        .then(res => {
            if (!res.ok) throw new Error(`HTTP status code failure: ${res.status}`);
            return res.text();
        })
        .then(html => {
            restoreButton(dropzone);
            results.style.display = "block";
            results.innerHTML = html;
        })
        .catch(err => {
            restoreButton(dropzone);
            results.style.display = "block";
            results.innerHTML = `<div style="color: #dc3545; font-weight: bold;">Pipeline Exception Encountered:</div><p>${err.message || err}</p>`;
        });
    }
</script>

</body>
</html>
