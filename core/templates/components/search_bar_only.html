<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

{% load custom_tags %} 
{% get_product_groups as groups %}
{% get_collections as collections %}

<style>
/* --- Layout Wrapper --- */
.filter-row-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto 20px auto;
}

.status-badge-selector {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
}

.autocomplete-container {
    flex: 1 1 280px;
    max-width: 320px;
    display: flex;
    flex-direction: column;
}

/* --- Restored Original Status Badge Styles --- */
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    border: 1.5px solid #ddd;
    background-color: #f9f9f9;
    color: #888;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
}

/* --- STATE 0: DISABLED (Default) --- */
.status-badge[data-state="0"] {
    opacity: 0.45;
    border-color: #e5e7eb;
    background-color: #f9fafb;
    color: #9ca3af;
    text-decoration: none;
}
.status-badge[data-state="0"] .badge-dot {
    background-color: #9ca3af !important;
}

/* --- STATE 1: INCLUDED (Green Glow) --- */
.status-badge[data-state="1"] {
    opacity: 1;
    background-color: #ecfdf5;
    color: #065f46;
    border-color: #34d399;
    box-shadow: 0 0 12px rgba(52, 211, 153, 0.45);
}

/* --- STATE 2: EXCLUDED (Red Glow + Strike-through) --- */
.status-badge[data-state="2"] {
    opacity: 1;
    background-color: #fef2f2;
    color: #991b1b;
    border-color: #f87171;
    box-shadow: 0 0 12px rgba(248, 113, 113, 0.45);
    text-decoration: line-through;
    text-decoration-thickness: 2px;
}
.status-badge[data-state="2"] .badge-dot {
    background-color: #ef4444 !important;
}

/* Base dot styles */
.status-badge .badge-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    transition: background-color 0.2s ease;
}

/* Custom color definitions for State 1 (Included) */
.status-badge.pre-list[data-state="1"] .badge-dot { background-color: #bbb; }
.status-badge.priced[data-state="1"] .badge-dot { background-color: #007b1be6; }
.status-badge.reviewed[data-state="1"] .badge-dot { background-color: #df04dbbc; }
.status-badge.listed[data-state="1"] .badge-dot { background-color: #00aaff; }
.status-badge.hold-sold[data-state="1"] .badge-dot { background-color: #374151; }

/* --- Clean & Flat Select2 Theme --- */
.select2-container--default .select2-selection--single {
    border: 1px solid #e2e8f0 !important;
    border-radius: 6px !important;
    height: 34px !important;
    padding: 4px 10px !important;
    outline: none !important;
    font-size: 13px !important;
    background-color: #f9fafb !important;
    display: flex !important;
    align-items: center !important;
}
.select2-container--default .select2-selection--single .select2-selection__arrow {
    height: 32px !important;
    right: 8px !important;
}
.select2-dropdown {
    border: 1px solid #e2e8f0 !important;
    border-radius: 6px !important;
    overflow: hidden;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
}

/* Dropdown Options Styling */
.search-result-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 0;
    font-size: 13px;
}
.search-result-title {
    color: #1f2937;
}
.search-result-meta {
    font-size: 10px;
    color: #6b7280;
    background: #f3f4f6;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: monospace;
    white-space: nowrap;
}
</style>

<div class="search-container" style="margin: 30px 0; display: flex; gap: 12px; justify-content: center; align-items: center;">
    <input type="text" id="card-search-input" 
           placeholder="Search cards..." 
           style="width: 100%; max-width: 600px; padding: 12px 18px; border-radius: 8px; border: 1px solid #e2e8f0; outline: none; font-size: 16px;">
    
    <button id="card-search-btn" 
            style="padding: 12px 24px; border-radius: 8px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; font-size: 16px;">
        Search
    </button>
</div>

<div class="filter-row-container">
    
    <div class="status-badge-selector">
        <span style="font-size: 13px; color: #666; font-weight: bold; margin-right: 5px;">Statuses:</span>
        
        <div class="status-badge pre-list" data-status="imported" data-state="0">
            <span class="badge-dot"></span> Imported
        </div>
        <div class="status-badge priced" data-status="priced,unlisted,pending" data-state="0">
            <span class="badge-dot"></span> Pricing
        </div>
        <div class="status-badge reviewed" data-status="reviewed" data-state="0">
            <span class="badge-dot"></span> Reviewed
        </div>
        <div class="status-badge listed" data-status="listed,staged,confirmed" data-state="0">
            <span class="badge-dot"></span> Listed / Staged
        </div>
        <div class="status-badge hold-sold" data-status="held,sold" data-state="0">
            <span class="badge-dot"></span> Hold / Sold
        </div>
    </div>
</div>

<div class="timeframe-selector" style="justify-content: center; display: flex; gap: 15px; margin-bottom: 10px; font-size: 12px; color: #6b7280;">
    <span>Timeframe:</span>
    <label style="cursor: pointer;"><input type="radio" name="search-timeframe" value="7"> Last Week</label>
    <label style="cursor: pointer;"><input type="radio" name="search-timeframe" value="30"> Last 30 Days</label>
    <label style="cursor: pointer;"><input type="radio" name="search-timeframe" value="60"> Last 60 Days</label>
    <label style="cursor: pointer;"><input type="radio" name="search-timeframe" checked value="120"> Last 120 Days</label>
    <label style="cursor: pointer;"><input type="radio" name="search-timeframe" value="0"> All Time</label>
</div>

<script>
(function($) {
    $(document).ready(function() {
        
        if (typeof $.fn.select2 === 'undefined') {
            console.error("Select2 is not registered on this instance of jQuery.");
            return;
        }

        const params = new URLSearchParams(window.location.search);
        const urlQuery = params.get('q');
        const urlTimeframe = params.get('timeframe');
        const includedStatuses = params.getAll('status');
        const excludedStatuses = params.getAll('exclude_status');

        // --- 1. RESTORE STATE: Input & Timeframe ---
        if (urlQuery) {
            // Decodes any URL encoding and strips any leading/trailing single or double quotes
            const cleanQuery = decodeURIComponent(urlQuery).replace(/^['"]|['"]$/g, '');
            $('#card-search-input').val(cleanQuery);
        }
        if (urlTimeframe) {
            $(`input[name="search-timeframe"][value="${urlTimeframe}"]`).prop('checked', true);
        }

        // --- 2. INITIALIZE SELECT2 ---
        $('#target-selector').select2({
            allowClear: true,
            placeholder: "Link Collection or Group...",
            templateResult: formatSelectionResult, 
            templateSelection: formatSelectionText 
        });

        // --- 3. RESTORE STATE: Select2 Option Select ---
        const initialCollection = params.get('collection_id');
        const initialGroup = params.get('group_key');

        if (initialCollection) {
            $('#target-selector').val(`col_${initialCollection}`).trigger('change');
        } else if (initialGroup) {
            $('#target-selector').val(`grp_${initialGroup}`).trigger('change');
        }

        // --- 4. RESTORE STATE: Status Badges ---
        $('.status-badge').each(function() {
            const badge = $(this);
            const statusVals = badge.attr('data-status').split(',');

            const isIncluded = statusVals.some(val => includedStatuses.includes(val));
            const isExcluded = statusVals.some(val => excludedStatuses.includes(val));

            if (isIncluded) {
                badge.attr('data-state', '1');
            } else if (isExcluded) {
                badge.attr('data-state', '2');
            } else {
                badge.attr('data-state', '0');
            }
        });

        // Toggle Tri-State on status badges (0 -> 1 -> 2 -> 0)
        $('.status-badge').on('click', function() {
            const badge = $(this);
            const currentState = parseInt(badge.attr('data-state'), 10);
            const nextState = (currentState + 1) % 3;
            badge.attr('data-state', nextState.toString());
        });

        // --- 5. SEARCH FORM SUBMISSION ---
        $('#card-search-btn').on('click', function() {
            const query = $('#card-search-input').val().trim();
            const timeframe = $('input[name="search-timeframe"]:checked').val();
            const newParams = new URLSearchParams();
            
            if (query) {
                // FIXED: Removed the template literal wrapper `"${query}"`
                newParams.set('q', query); 
            }
            
            if (timeframe && timeframe !== "0") {
                newParams.set('timeframe', timeframe);
            }

            // Capture Selected Collection or Group
            const selectedOption = $('#target-selector').find(':selected');
            if (selectedOption.length && selectedOption.val() !== "") {
                const type = selectedOption.data('type');
                const identifier = selectedOption.data('identifier');
                
                if (type === 'collection') {
                    newParams.set('collection_id', identifier);
                } else if (type === 'group') {
                    newParams.set('group_key', identifier);
                }
            }

            // Capture Badge Status States
            $('.status-badge').each(function() {
                const badge = $(this);
                const state = badge.attr('data-state');
                const statusVals = badge.attr('data-status').split(',');

                statusVals.forEach(statusVal => {
                    const cleanVal = statusVal.trim();
                    if (state === "1") {
                        newParams.append('status', cleanVal);
                    } else if (state === "2") {
                        newParams.append('exclude_status', cleanVal);
                    }
                });
            });

            window.location.search = newParams.toString();
        });

        $('#card-search-input').on('keypress', function(e) {
            if (e.which == 13) {
                $('#card-search-btn').click();
            }
        });
    });

    // Minimal Custom Option Rendering
    function formatSelectionResult(item) {
        if (!item.element || !$(item.element).data('type')) { 
            return item.text; 
        } 
        
        const type = $(item.element).data('type');
        const name = $(item.element).data('name');
        const identifier = $(item.element).data('identifier');

        return $(`
            <div class="search-result-item">
                <span class="search-result-meta">${type.toUpperCase()}:${identifier}</span>
                <span class="search-result-title">${name}</span>
            </div>
        `);
    }

    // Minimal Selected Text Rendering
    function formatSelectionText(item) {
        if (!item.element || !$(item.element).data('type')) { 
            return item.text; 
        }
        
        const type = $(item.element).data('type');
        const name = $(item.element).data('name');
        const identifier = $(item.element).data('identifier');

        return `${type === 'collection' ? '📁' : '📦'} ${name} (${identifier})`;
    }

})(jQuery);
</script>
