{% load static %}
<div class="search-container" style="margin: 30px 0; display: flex; gap: 12px; justify-content: center; align-items: center;">
    <input type="text" id="card-search-input" 
           placeholder="Search cards..." 
           style="width: 100%; max-width: 700px; padding: 14px 20px; border-radius: 30px; border: 2px solid #ddd; outline: none; font-size: 18px;">
    
    <button id="card-search-btn" 
            style="padding: 14px 28px; border-radius: 30px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; font-size: 18px;">
        Search
    </button>
</div>
<script src="{% static 'js/search_orchestration.js' %}"></script>
<script>
    // Component logic: Only handles the "Trigger"
    (function() {
        const input = document.getElementById('card-search-input');
        const btn = document.getElementById('card-search-btn');
        
        const triggerSearch = () => {
            const query = input.value.trim();
            // Dispatches a custom event so any parent can listen for it
            document.dispatchEvent(new CustomEvent('cardSearchTriggered', { detail: { query } }));
        };

        btn.addEventListener('click', triggerSearch);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') triggerSearch(); });
    })();
</script>
