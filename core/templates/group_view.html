{% load custom_tags %}
{% load static %}

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{% static 'js/collection_node.js' %}"></script>
<script>
console.log("[DEBUG] Initializing page scripts.");

// --- UI Management ---
function switchTab(tabId, event) {
    document.querySelectorAll('.tab-content').forEach(content => {
        content.style.display = 'none';
        content.classList.remove('active');
    });
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

    const selectedTab = document.getElementById(tabId);
    if (selectedTab) {
        selectedTab.style.display = 'block';
        selectedTab.classList.add('active');
    }
    if (event) event.currentTarget.classList.add('active');

    if (tabId === 'table-view') {
        const hot = SpreadsheetModule.getInstance();
        if (hot) setTimeout(() => hot.render(), 50);
    }
}

function filterSpreadsheet() {
    const visibleCards = document.querySelectorAll('.card-item:not(.hidden-card):not(.folder)');
    const visibleIds = Array.from(visibleCards).map(card => card.getAttribute('data-id'));
    SpreadsheetModule.filterByCardIds(visibleIds);
}

function updateSpreadsheet(tableData, colHeaders) {
    SpreadsheetModule.init('hot-spreadsheet', tableData, colHeaders);
    filterSpreadsheet();
}

function launchSequence() {
    const checkedBoxes = document.querySelectorAll('input[name="selected_cards"]:checked');
    let ids = Array.from(checkedBoxes).map(cb => cb.value);

    if (ids.length === 0) {
        ids = JSON.parse(sessionStorage.getItem('card_sequence') || "[]");
    }

    if (ids.length === 0) {
        alert("No cards selected or visible!");
        return;
    }

    sessionStorage.setItem('card_sequence', JSON.stringify(ids));
    localStorage.setItem('session_bridge', JSON.stringify(ids));
}

function syncCardView(id, updatedFields) {
    const card = document.querySelector(`.card-item[data-id="${id}"]`);
    if (!card) return;

    Object.entries(updatedFields).forEach(([field, value]) => {
        const el = card.querySelector(`.card-${field}`);
        if (el) el.textContent = value;
    });

    if (updatedFields.status) {
        card.className = card.className.replace(/status-\w+/, `status-${updatedFields.status.toLowerCase()}`);
    }
}
</script>

{% include "header.html" %}
<link rel="stylesheet" href="{% static 'css/collection.css' %}">

<div id="collection-0" class="collection">
    <div class="collection-node">
        <!-- Collection Header Included Here -->
        {% include "components/collection_tools.html" %}
        {% include "product_groups.html" with product_group=group %}
        
        {% block content %}
            {% include "components/collection_display_tabs.html" with q=q timeframe=timeframe %}
        {% endblock %}
    </div>
</div>
