<style>
.listing-group {
  margin-bottom: 16px;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 8px;
  background: #f9f9f9;
}

.listing-header {
  font-weight: bold;
  font-size: 1rem;
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.listing-header-label {
  margin-right: 8px;
}

.listing-toggle {
  font-size: 0.85rem;
  color: #555;
}

.search-string {
  font-size: 1rem;
  color: #060505ff;
  margin: 4px 0 12px 0;
}

/* Collapsed: one row */
.listing-group.collapsed .image-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;

  height: 120px;
  max-height: 120px;
  overflow: hidden;
  transition: height 0.25s ease;
}

/* Expanded: full height */
.listing-group.expanded .image-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;

  height: auto;
  max-height: none;
  overflow: visible;
}

.listing {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 100px;
}

.listing-thumb {
  max-width: 100px;
  max-height: 100px;
  object-fit: contain;
  border-radius: 6px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}

.listing-caption {
  margin-top: 0px;
  font-size: 0.85rem;
  color: #333;
  text-align: center;
}

.sort-controls {
  margin: 4px 0 12px 0;
  font-size: 0.9rem;
}

.sort-title {
  margin-right: 8px;
  color: #333;
  font-weight: 500;
}

.sort-link {
  cursor: pointer;
  color: #0074d9;
  margin-right: 12px;
}

.sort-link:hover {
  text-decoration: underline;
}

.sort-link.active {
  font-weight: bold;
  text-decoration: underline;
}
</style>


<div class="listing-group collapsed" data-listing-group>
  <div class="listing-header" data-toggle>
    <span class="listing-header-label">
      {{ listing_group.label }} ({{ listing_group.listings.count }})
    </span>
    <span class="listing-toggle" data-toggle-label>Show more</span>
  </div>

  <div class="search-string">
    {{ listing_group.id_string }} {{ listing_group.filter_terms }}
  </div>

  <div class="sort-controls">
    <span class="sort-title">Sort:</span>
    <span class="sort-link" data-sort="price" data-dir="desc">Price ↓</span>
    <span class="sort-link" data-sort="date" data-dir="desc">Date ↓</span>
    <span class="sort-link" data-sort="title" data-dir="asc">Title ↑</span>
  </div>

  <div class="image-grid">

    {% for listing in listing_group.listings.all %}
      <div class="listing"
           data-price="{{ listing.ebay_price }}"
           data-date="{{ listing.pretty_display_date|date:'c' }}"
           data-title="{{ listing.title }}"
           data-format="{{ listing.format }}"
           data-qty="{{ listing.qty }}">

        <a href="{{ listing.img_url }}" target="_blank" rel="noopener noreferrer">
          <img src="{{ listing.thumb_url }}"
               alt="Listing Image"
               class="listing-thumb"
               title="{{ listing.title }}
{{ listing.pretty_display_date|date:'m/d/Y' }}
{{ listing.ebay_price }}
Format: {{ listing.format }}
Qty: {{ listing.qty }}
{{ listing.item_id }}">
        </a>

        <div class="listing-caption">{{ listing.ebay_price }}</div>
      </div>
    {% empty %}
      <p>No listings found.</p>
    {% endfor %}
  </div>
</div>


<script>
document.addEventListener("DOMContentLoaded", function () {
  const groups = document.querySelectorAll("[data-listing-group]");

  groups.forEach(group => {
    const grid = group.querySelector(".image-grid");
    const listings = Array.from(grid.querySelectorAll(".listing"));
    const toggle = group.querySelector("[data-toggle]");
    const toggleLabel = group.querySelector("[data-toggle-label]");
    const sortLinks = group.querySelectorAll(".sort-link");

    // Extract values once
    listings.forEach(listing => {
      listing.dataset.price = parseFloat(listing.dataset.price) || 0;
      listing._sortDate = new Date(listing.dataset.date).getTime() || 0;
      listing._sortTitle = listing.dataset.title.toLowerCase();
    });

    function applySort(mode, dir) {
      listings.sort((a, b) => {
        let result = 0;

        if (mode === "price") {
          result = a.dataset.price - b.dataset.price;
        } else if (mode === "date") {
          result = a._sortDate - b._sortDate;
        } else if (mode === "title") {
          result = a._sortTitle.localeCompare(b._sortTitle);
        }

        return dir === "asc" ? result : -result;
      });

      listings.forEach(l => grid.appendChild(l));
    }

    // Default sort
    applySort("date", "desc");

    // Mark Date as the default active sort
    sortLinks.forEach(l => l.classList.remove("active"));
    const defaultLink = group.querySelector('[data-sort="date"]');
    defaultLink.classList.add("active");

    // Link click handlers
    sortLinks.forEach(link => {
      link.addEventListener("click", () => {
        const mode = link.dataset.sort;
        const currentDir = link.dataset.dir;
        const newDir = currentDir === "desc" ? "asc" : "desc";

        // Update direction
        link.dataset.dir = newDir;

        // Update label arrow
        const arrow = newDir === "desc" ? "↓" : "↑";
        link.textContent = `${link.dataset.sort.charAt(0).toUpperCase() + link.dataset.sort.slice(1)} ${arrow}`;

        // Clear active class from all links
        sortLinks.forEach(l => l.classList.remove("active"));

        // Set active class on this link
        link.classList.add("active");

        applySort(mode, newDir);
      });
    });


    // Expand/collapse
    toggle.addEventListener("click", () => {
      const isCollapsed = group.classList.contains("collapsed");
      group.classList.toggle("collapsed", !isCollapsed);
      group.classList.toggle("expanded", isCollapsed);
      toggleLabel.textContent = isCollapsed ? "Show less" : "Show more";
    });
  });
});
</script>
