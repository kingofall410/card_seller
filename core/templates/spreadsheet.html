{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Collections Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.css">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@13.0.0/dist/handsontable.full.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <style>
        #spreadsheet-container { margin-top: 1rem; width: 100%; height: 85vh; border: 1px solid #ccc; }
        .htCenter { text-align: center !important; }
        .htRight { text-align: right !important; }
        /* Style for the sorting indicator arrows */
        .columnSorting:after { color: #007bff !important; margin-left: 5px; content: ' \2195'; font-size: 0.8em; }
    </style>
</head>
<body>

<div id="spreadsheet-container">
    <div id="spreadsheet"></div>
</div>

{{ columns|json_script:"sheet_columns" }}
{{ rows|json_script:"sheet_rows" }}

<script>
/**
 * RENDERERS
 */
function collectionLinkRenderer(instance, td, row, col, prop, value, cellProperties) {
    if (value) {
        td.innerHTML = `<a href="/collection/${value}" style="font-weight:bold; color:#007bff; text-decoration:none;">${value}</a>`;
    }
    td.className = 'htCenter';
    return td;
}

function simpleCurrencyRenderer(instance, td, row, col, prop, value, cellProperties) {
    const numValue = parseFloat(value);
    td.innerText = !isNaN(numValue) 
        ? '$' + numValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})
        : '$0.00';
    td.className = 'htRight';
    return td;
}

document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('spreadsheet');
    const columnsData = JSON.parse(document.getElementById('sheet_columns').textContent);
    const rowsData = JSON.parse(document.getElementById('sheet_rows').textContent);

    const hot = new Handsontable(container, {
        data: rowsData,
        licenseKey: 'non-commercial-and-evaluation',
        rowHeaders: true,
        colHeaders: columnsData.map(c => c.replace(/_/g, ' ').toUpperCase()),
        height: '100%',
        width: '100%',
        stretchH: 'all',
        
        // --- ROW SORTING PLUGIN ---
        columnSorting: true, 
        sortIndicator: true,
        
        // Other useful UI plugins
        manualColumnResize: true,
        autoColumnSize: true,
        contextMenu: ['copy', 'cut'], 

        columns: columnsData.map((colName) => {
            if (colName === 'id') {
                return { data: colName, renderer: collectionLinkRenderer, readOnly: true };
            }
            if (['total_cards', 'num_listed', 'num_pending', 'num_failed'].includes(colName)) {
                return { data: colName, type: 'numeric', readOnly: true, className: 'htCenter' };
            }
            if (colName === 'total_value') {
                return { data: colName, renderer: simpleCurrencyRenderer, readOnly: true };
            }
            return { data: colName, type: 'text' };
        }),

        // --- BACKEND SYNC (Sorted-Safe) ---
        afterChange: function(changes, source) {
            if (source === 'loadData' || !changes) return;

            changes.forEach(([visualRow, prop, oldValue, newValue]) => {
                if (oldValue === newValue) return;
                
                // CRITICAL: Get ID by the visual row index to handle sorting correctly
                const collectionId = this.getDataAtRowProp(visualRow, 'id');
                
                if (collectionId) {
                    $.post("/update_collection/", {
                        collectionId: collectionId,
                        field: prop,
                        value: newValue,
                        csrfmiddlewaretoken: '{{ csrf_token }}'
                    })
                    .done(() => console.log(`Saved ${prop} for ID ${collectionId}`))
                    .fail((xhr) => console.error(`Save failed:`, xhr.responseText));
                }
            });
        }
    });
});
</script>
</body>
</html>
