<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }} – Sold Price Over Time</title>

  <!-- Chart.js and plugins -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>

  <style>
    .chart-container {
      width: 100%;
      min-height: 500px;
      margin: 40px auto;
    }
    .title-header {
      text-align: center;
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }
    .controls {
      text-align: center;
      margin-top: 20px;
    }
    .controls label {
      margin-right: 12px;
    }
    canvas {
      width: 100% !important;
      }
  #chartjs-custom-tooltip {
  position: fixed;        /* instead of absolute */
  z-index: 999999;        /* higher than anything else */
  pointer-events: none;
  background: rgba(0,0,0,0.85);
  color: white;
  padding: 8px;
  border-radius: 6px;
  font-size: 12px;
  transition: opacity 0.1s ease;
  opacity: 0;
  width: auto;
  height: auto;
  display: inline-block;
}


  #chartjs-custom-tooltip img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    display: block;
    margin-top: 6px;
    border-radius: 4px;
  }
.title-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px; /* Space between title and button */
  text-align: center;
  margin-top: 20px;
  font-size: 22px;
  font-weight: bold;
}

.refresh-btn {
  background-color: #f0f0f0;
  border: 1px solid #ccc;
  border-radius: 4px;
  padding: 5px 12px;
  font-size: 14px;
  font-weight: normal;
  cursor: pointer;
  transition: background-color 0.2s;
}

.refresh-btn:hover {
  background-color: #e0e0e0;
}

.refresh-btn:active {
  background-color: #d0d0d0;
  transform: translateY(1px);
}
  </style>
</head>
<body>
  <div class="title-header">
  {{ title }} – Sold Price Over Time
  <button type="button" class="refresh-btn" id="refresh-trigger" onclick="updateChartData()">
      🔄 Refresh
  </button>
</div>
  <div class="controls">
      <label for="movingAvgWindow-time">Window (%):</label>
      <input type="number" oninput="updateChartWrapper()" id="movingAvgWindow-time" value="25" step="1" min="1" max="50" style="width: 60px;">
      
      <label for="maxPriceLimit">Max Price ($):</label>
      <input type="number" oninput="updateChartWrapper()" id="maxPriceLimit" value="0" step="100" style="width: 80px;">

      <div style="margin-top: 12px;">
        <label><input type="radio" name="timeRange" value="3" onchange="updateChartWrapper()" checked> 3 Months</label>
        <label><input type="radio" name="timeRange" value="6" onchange="updateChartWrapper()"> 6 Months</label>
        <label><input type="radio" name="timeRange" value="12" onchange="updateChartWrapper()"> 1 Year</label>
        <label><input type="radio" name="timeRange" value="0" onchange="updateChartWrapper()"> All Time</label>
      </div>

      <div id="toggle-container" style="margin-top: 12px;"></div>
  </div>
  <div class="chart-container">
    <canvas id="priceTimeChart-{{ title }}"></canvas>
  </div>
<script>
(function() {
  const datasetConfigs = JSON.parse(`{{ datasetConfigs|escapejs }}`);

  const ctxTime = document.getElementById(`priceTimeChart-{{ title }}`).getContext('2d');
  let timeChart;
  let swapOnLeave;
  let persistentMatches = []

  // -----------------------------------------------------
  // CLICK LISTING
  // -----------------------------------------------------
  window.addEventListener("clickListing", (e) => {
    if (!timeChart) return;

    const listingId = String(e.detail.listing_id);

    const matches = [];

    timeChart.data.datasets.forEach((dataset, datasetIndex) => {
      dataset.data.forEach((point, index) => {
        if (point.ids && point.ids.includes(listingId)) {
          matches.push({ datasetIndex, index });
        }
      });
    });

    matches.forEach(match => {
      const exists = persistentMatches.find(
        m => m.datasetIndex === match.datasetIndex && m.index === match.index
      );

      if (exists) {
        persistentMatches = persistentMatches.filter(
          m => !(m.datasetIndex === match.datasetIndex && m.index === match.index)
        );
      } else {
        persistentMatches.push(match);
      }
    });

    // Reapply persistent highlights
    timeChart.setActiveElements(persistentMatches);
    timeChart.tooltip.setActiveElements(persistentMatches);
    timeChart.update();
  });



  window.addEventListener("resize", () => {
    if (timeChart) timeChart.resize();
  });

  // -----------------------------------------------------
  // HIGHLIGHT LISTING
  // -----------------------------------------------------
  window.addEventListener("highlightListing", (e) => {
    const listingId = String(e.detail.listing_id);
    const groupId = String(e.detail.group_id);

    if (!timeChart) return;

    const toggle = document.getElementById(`toggle-group-${groupId}`);

    if (toggle && !toggle.checked) {
      toggle.checked = true;
      swapOnLeave = true;
      updateChart();
    }

    // ❗ Start with a *fresh* array
    const hoverMatches = [];

    // Find hover matches
    timeChart.data.datasets.forEach((dataset, datasetIndex) => {
      dataset.data.forEach((point, index) => {
        if (point.ids && point.ids.includes(listingId)) {
          hoverMatches.push({ datasetIndex, index });
        }
      });
    });

    // Combine hover + persistent (but do NOT mutate persistent)
    const combinedMatches = [
      ...persistentMatches,
      ...hoverMatches
    ];

    if (combinedMatches.length === 0) {
      timeChart.setActiveElements([]);
      timeChart.update();
      return;
    }

    // Emphasize selected group
    timeChart.data.datasets.forEach((ds, i) => {
      if (hoverMatches.some(m => m.datasetIndex === i)) {
        ds.borderWidth = 4;
      } else {
        ds.borderWidth = 1;
      }
    });

    timeChart.setActiveElements(combinedMatches);
    timeChart.tooltip.setActiveElements(combinedMatches);
    timeChart.update();
  });


  // -----------------------------------------------------
  // UNHIGHLIGHT LISTING
  // -----------------------------------------------------
  window.addEventListener("unhighlightListing", (e) => {
    const groupId = String(e.detail.group_id);

    if (!timeChart) return;

    const toggle = document.getElementById(`toggle-group-${groupId}`);

    if (toggle && swapOnLeave) {
      toggle.checked = false;
      swapOnLeave = false;
      updateChart();
    }

    // Restore line emphasis (but NOT point radius)
    timeChart.data.datasets.forEach(ds => {
      ds.borderWidth = 1;
    });

    // Clear ONLY hover highlight
    timeChart.setActiveElements([]);

    // Reapply persistent highlights
    if (persistentMatches.length > 0) {
      timeChart.setActiveElements(persistentMatches);
      timeChart.tooltip.setActiveElements(persistentMatches);
    } else {
      timeChart.tooltip.setActiveElements([]);
    }

    timeChart.update();
  });


  // -----------------------------------------------------
  // EXTERNAL TOOLTIP HANDLER
  // -----------------------------------------------------
  function externalTooltipHandler(context) {
    const { chart, tooltip } = context;

    const container = chart.canvas.parentNode;

    let tooltipEl = container.querySelector('#chartjs-custom-tooltip');
    if (!tooltipEl) {
      tooltipEl = document.createElement('div');
      tooltipEl.id = 'chartjs-custom-tooltip';
      container.appendChild(tooltipEl);
    }

    if (tooltip.opacity === 0) {
      tooltipEl.style.opacity = 0;
      return;
    }

    const point = tooltip.dataPoints[0].raw;

    tooltipEl.innerHTML = `
      <div>Price: $${point.y.toFixed(2)}</div>
      <img src="${point.thumb}" />
    `;

    const rect = chart.canvas.getBoundingClientRect();
    const xScale = rect.width / chart.canvas.width;
    const yScale = rect.height / chart.canvas.height;

    // Correct tooltip positioning
    tooltipEl.style.left = (tooltip.caretX * xScale + 10) + "px";
    tooltipEl.style.top  = (tooltip.caretY * yScale + 10) + "px";
    tooltipEl.style.opacity = 1;
  }

  // -----------------------------------------------------
  // UPDATE CHART WRAPPER
  // -----------------------------------------------------
  window.updateChartWrapper = function() {
    updateChart();
  };

  // -----------------------------------------------------
  // TOGGLES
  // -----------------------------------------------------
  datasetConfigs.forEach(({ key, label, display_default }) => {
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.id = `toggle-${key}`;
    checkbox.checked = display_default;
    checkbox.onchange = updateChartWrapper;

    const labelEl = document.createElement("label");
    labelEl.appendChild(checkbox);
    labelEl.appendChild(document.createTextNode(` ${label}`));
    labelEl.style.marginRight = "12px";

    document.getElementById("toggle-container").appendChild(labelEl);
    
  });

  // -----------------------------------------------------
  // DATA PROCESSING
  // -----------------------------------------------------
  function filterByPrice(data, maxPrice) {
    return data.filter(([price]) => price <= maxPrice);
  }

  function buildSeries(rawData, windowPercentage = 1) {
    const groupedByDay = {};

    rawData.forEach(([price, title, thumb, date, id]) => {
      const day = new Date(date).toISOString().split('T')[0];
      if (!groupedByDay[day]) groupedByDay[day] = [];
      groupedByDay[day].push({ price, title, thumb, date, id });
    });

    const dailyHighs = Object.entries(groupedByDay).map(([day, entries]) => {
      const highest = entries.reduce((max, entry) =>
        entry.price > max.price ? entry : max,
        entries[0]
      );

      return {
        x: new Date(day).toISOString(),
        y: highest.price,
        title: highest.title,
        thumb: highest.thumb,
        ids: entries.map(e => String(e.id))
      };
    });

    const sorted = dailyHighs.sort((a, b) => new Date(a.x) - new Date(b.x));

    // Calculate dynamic window size
    const totalPoints = sorted.length;
    const windowSize2 = Math.max(1, Math.floor(totalPoints * (windowPercentage / 100)));

    if (windowSize2 > 1) {
        return sorted.map((point, i, arr) => {
            const start = Math.max(0, i - Math.floor(windowSize2 / 2));
            const end = Math.min(arr.length, i + Math.ceil(windowSize2 / 2));
            const window = arr.slice(start, end);
            const avg = window.reduce((sum, p) => sum + p.y, 0) / window.length;

            return {
                ...point,
                y: avg,
                ids: [...new Set(window.flatMap(p => p.ids))]
            };
        });
    }

    return sorted;
  }

  function getToggleState(key) {
    const el = document.getElementById(`toggle-${key}`);
    return el ? el.checked : false;
  }

  // -----------------------------------------------------
  // UPDATE CHART
  // -----------------------------------------------------
  window.updateChart = function() {
    const windowPercentage = Math.max(1, parseInt(document.getElementById("movingAvgWindow-time").value));
    const userMaxLimit = parseFloat(document.getElementById("maxPriceLimit").value) || 0;
    
    const datasets = [];
    let globalMax = 0;
    const today = new Date();
    const todayISO = today.toISOString();

    // --- STEP 1: PRE-CALCULATE BOUNDARIES ---
    // We need to know the latest date across all datasets BEFORE we set the minDate
    let absoluteLatestDate = null;
    datasetConfigs.forEach(({ key, data, rp_upper }) => {
      if (!getToggleState(key)) return;
      data.forEach(([price, , , date]) => {    
        const d = new Date(date);
        if (!absoluteLatestDate || d > absoluteLatestDate) absoluteLatestDate = d;
      });
      if (rp_upper > globalMax) globalMax = rp_upper;
    });
    
    // --- STEP 2: CALCULATE VIEWPORT (The Buttons) ---
    const radioEl = document.querySelector('input[name="timeRange"]:checked');
    const selectedRange = radioEl ? parseInt(radioEl.value) : 0;

    let minDate = undefined;
    if (selectedRange > 0) {
        // Look back from Today
        minDate = new Date(today); 
        minDate.setMonth(minDate.getMonth() - selectedRange);
    }

    // --- STEP 3: BUILD DATASETS ---
    datasetConfigs.forEach(({ key, label, color, lineStyle, data, trend_overall, trend_recent, recent_date, velocity_recent, overall_start_price, overall_end_price, branch_point_y, rp_upper, rp_lower, unfiltered_start, unfiltered_end }) => {
      if (!getToggleState(key)) return;
      
      const series = buildSeries(data, windowPercentage);
      console.log(rp_upper, series[0])
      if (!series.length) return;
      if (label.includes("ID")) {
          datasets.push({
            label: `${label} Valid Zone`,
            data: [
                { x: series[0].x, y: rp_upper }, // Start of the ceiling
                { x: todayISO, y: rp_upper }     // End of the ceiling
            ],
            type: 'line',
            // 'origin' fills from the line down to the 0 axis
            fill: 'origin', 
            // Use a very low decimal for the alpha (0.03 to 0.07)
            backgroundColor: 'rgba(247, 234, 199, 0.6)', 
            borderColor: 'transparent', 
            pointRadius: 0,
            lineTension: 0,
            showLine: true,
            order: 10 // Ensures it stays behind the scatter dots
        });
      } else {
        // 1. OVERALL TREND LINE
        const overallStartPrice = overall_start_price; 
        const overallCurrentPrice = overallStartPrice * (1 + (trend_overall / 100));
        console.log("overall:", overallStartPrice, overallCurrentPrice, overall_end_price, trend_overall)
        datasets.push({
            label: `${label} Overall Trend`,
            data: [
                { x: series[0].x, y: overallStartPrice }, 
                { x: todayISO, y: overallCurrentPrice }
            ],
            type: 'line',
            borderColor: color,
            borderDash: [6, 9],
            pointRadius: 0,
            yAxisID: 'y' 
        });

        // 2. RECENT TREND LINE
        const recentStartDate = new Date(recent_date).toISOString();
        const recentStartPoint = branch_point_y;

        // The starting Y is now calculated relative to the Overall Line's height at that time
        const recentCurrentPrice = branch_point_y * (1 + (trend_recent / 100));
        console.log("recent:", recentStartPoint, overallCurrentPrice)
        console.log("rcp:", recentCurrentPrice, trend_recent, branch_point_y)
        console.log(todayISO)
        datasets.push({
            label: `${label} Recent Trend (${trend_recent.toFixed(1)}%)`,
            data: [
                { x: recentStartDate, y: recentStartPoint }, 
                { x: todayISO, y: recentCurrentPrice }
            ],
            type: 'line',
            borderColor: color,
            borderDash: [2, 2],
            pointRadius: 0,
            yAxisID: 'y' 
        });
            
        // UNFILTERED TREND LINE
        const unfilteredStart = unfiltered_start; 
        const unfilteredEnd = unfiltered_end
        console.log("overall:", overallStartPrice, overallCurrentPrice, overall_end_price, trend_overall)
        datasets.push({
            label: `Unfiltered`,
            data: [
                { x: series[0].x, y: unfilteredStart }, 
                { x: todayISO, y: unfilteredEnd }
            ],
            type: 'line',
            borderColor: 'rgba(255, 99, 132, 0.8)',
            borderDash: [6, 9],
            pointRadius: 0,
            yAxisID: 'y' 
        });

        // 3. Price Avg Line
        datasets.push({
            label: `${label} (Avg)`,
            data: series,
            type: 'line',
            borderColor: color,
            tension: 0.6,
            borderWidth: 2,
            pointRadius: 0,
            borderDash: lineStyle === "dotted" ? [6, 4] : []
        });

        // 4. Sales Velocity
        datasets.push({
            label: `${label} Velocity`,
            data: series.map(p => ({ x: p.x, y: velocity_recent })),
            type: 'line',
            backgroundColor: color.replace("0.8", "0.05"),
            fill: true,
            yAxisID: 'yVelocity',
            pointRadius: 0,
            borderWidth: 0
        });
      }
      // 5. Raw Sales (Scatter)
      // 1. Map your colors while you map your data
      const scatterData = [];
      const pointColors = [];

      data.forEach(([price, title, thumb, date, id]) => {
          scatterData.push({
              x: new Date(date).toISOString(),
              y: price,
              title,
              thumb,
              ids: [String(id)]
          });

          // Define your threshold logic here
          if (price > rp_upper) {
              pointColors.push('rgba(255, 99, 132, 0.8)'); // Red for high price
          } else {
              pointColors.push(color.replace("0.8", "0.4")); // Default color
          }
      });

      // 2. Pass the array to the dataset
      datasets.push({
          label: `${label} (Sales)`,
          data: scatterData,
          type: 'scatter',
          backgroundColor: pointColors, // Chart.js maps this index-to-index
          pointRadius: 3,
          pointHoverRadius: 8
      });
    });
    
    const chartMax = ((userMaxLimit > 0) ? userMaxLimit : globalMax*3);

    // --- STEP 4: RENDER ---
    if (timeChart) {
        timeChart.destroy();
    }

    timeChart = new Chart(ctxTime, {
        type: 'line',
        data: { datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    type: 'time',
                    time: { 
                        unit: 'month',
                        displayFormats: { month: 'MMM yyyy' }
                    },
                    min: minDate,
                    max: todayISO, 
                    title: { display: true, text: 'Date' }
                },
                y: {
                    type: 'linear',
                    position: 'right',
                    max: chartMax,
                    min: 0,
                    title: { display: true, text: 'Price ($)' }
                }/*,
                yVelocity: {
                    type: 'linear',
                    position: 'right',
                    grid: { drawOnChartArea: false },
                    title: { display: true, text: 'Sales/Mo' }
                }*/
            },
            plugins: {
                tooltip: {
                  enabled: false,
                  external: externalTooltipHandler
                },
                legend: { display: true },
                zoom: {
                    pan: { enabled: true, mode: 'x' },
                    zoom: { wheel: { enabled: true }, mode: 'x' }
                }
            }
        }
    });
  };

  updateChartWrapper();
  window.updateChartData = async function() {
      const btn = document.getElementById('refresh-trigger');
      const csr_id = "{{ search_result_id }}"; // Your ListedInfo ID

      try {
          btn.innerHTML = "⌛ Updating...";
          btn.disabled = true;

          const response = await fetch('/refresh_lg_calcs/{{ search_result.id }}/', {
              method: 'POST'
          });

          const result = await response.json();

          if (!result.error) {
              console.log("Success:", result.message);
              // Reload to show the newly calculated trend lines
              window.location.reload();
          } else {
              console.error("Server Error:", result.message);
              btn.innerHTML = "❌ Error";
          }
      } catch (error) {
          console.error("Fetch Error:", error);
          btn.innerHTML = "❌ Error";
      } finally {
          setTimeout(() => {
              btn.innerHTML = "🔄 Refresh";
              btn.disabled = false;
          }, 2000);
      }
  };
})();

</script>

</body>
</html>
